      const f = inp.dataset.f;
      inp.oninput = inp.onchange = e=>{
        const v = e.target.value;
        if(f==='tie') c.tieBreak = v || null;
        else if(f==='weight') c.weight = Number(v)||0;
        else c[f] = v;
        markDirty();
        if(f==='mode'||f==='name'||f==='short') render();
      };
    });
    p.querySelector('[data-a=up]').onclick = ()=>{ if(ci<1) return; const a=S.data.competitions; [a[ci],a[ci-1]]=[a[ci-1],a[ci]]; markDirty(); render(); };
    p.querySelector('[data-a=down]').onclick = ()=>{ const a=S.data.competitions; if(ci>=a.length-1) return; [a[ci],a[ci+1]]=[a[ci+1],a[ci]]; markDirty(); render(); };
    p.querySelector('[data-a=del]').onclick = ()=>{ if(!confirm(`刪除競賽「${c.name}」及其所有成績？`)) return;
      S.data.competitions = S.data.competitions.filter(x=>x.id!==c.id); markDirty(); S.tab='setup'; render(); };
    p.querySelector('[data-a=addev]').onclick = ()=>{
      c.events.push(newEvent('新項目', c.mode==='sum'?100:0));
      markDirty(); render();
    };

    const evHost = p.querySelector('#evs_'+c.id);
    c.events.forEach((ev,ei)=>{
      ev.record ||= { on:false, better:'min', value:'', holder:'', year:'', unit:'秒' };   // 保險
      const box = el(`<div class="evt"><div class="evt-hd">
          <h3>${esc(ev.name)}</h3>
          <div class="tools"><button class="btn sm" data-a="up">▲</button><button class="btn sm" data-a="down">▼</button>
            <button class="btn sm danger" data-a="del">刪除</button></div></div>
        <div class="panel-bd"><div class="cols">
          <div class="field"><label>項目名稱</label><input class="inp" data-f="name" value="${esc(ev.name)}"></div>
          <div class="field"><label>權重（%）</label><input class="inp" type="number" data-f="weight" value="${ev.weight}" ${c.mode==='sum'?'disabled':''}>
            <div class="note">${c.mode==='sum'?'累加模式不使用權重':'同競賽各項權重建議合計 100'}</div></div>
          <div class="field"><label>名次積分表</label><input class="inp" data-f="scores" value="${(ev.scores||[]).join(', ')}">
            <div class="note">依序為第 1、2、3… 名，用逗號分隔</div></div>
          <div class="field"><label>其餘名次積分</label><input class="inp" type="number" data-f="tail" value="${ev.tail}">
            <div class="note">超出積分表的名次一律給這個分數</div></div>
          <div class="field" style="grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px">
            <label class="chk" style="font-size:14px"><input type="checkbox" data-f="recOn" ${ev.record.on?'checked':''}>
              <b>啟用歷年成績比較（破紀錄判定）</b></label>
            <div class="note">開啟後，這個項目的成績表會多一欄「本次成績」，系統自動和歷年紀錄比對</div></div>
          ${ev.record.on ? `
          <div class="field"><label>歷年紀錄成績</label><input class="inp" data-f="recValue" value="${esc(ev.record.value||'')}" placeholder="0'41&quot;79 或 41.79">
            <div class="note">可填 0'41&quot;79、41&quot;79、41.79、1:09.58</div></div>
          <div class="field"><label>紀錄保持人／隊伍</label><input class="inp" data-f="recHolder" value="${esc(ev.record.holder||'')}" placeholder="例：RTK_Fatout"></div>
          <div class="field"><label>創紀錄年份</label><input class="inp" data-f="recYear" value="${esc(ev.record.year||'')}" placeholder="例：2024"></div>
          <div class="field"><label>判定方式</label>
            <select class="inp" data-f="recBetter">
              <option value="min" ${ev.record.better!=='max'?'selected':''}>越小越好（計時）</option>
              <option value="max" ${ev.record.better==='max'?'selected':''}>越大越好（計次、距離）</option>
            </select></div>
          <div class="field"><label>單位</label><input class="inp" data-f="recUnit" value="${esc(ev.record.unit||'秒')}" placeholder="秒 / 次 / 公尺"></div>
          ` : ''}
        </div></div></div>`);
      box.querySelectorAll('[data-f]').forEach(inp=>{
        const f = inp.dataset.f;
        inp.onchange = e=>{
          const v = e.target.value;
          if(f==='scores') ev.scores = v.split(/[,，\s]+/).filter(Boolean).map(Number).filter(x=>!isNaN(x));
          else if(f==='weight'||f==='tail') ev[f] = Number(v)||0;
          else if(f==='recOn'){ ev.record.on = e.target.checked; }
          else if(f==='recValue') ev.record.value = v;
          else if(f==='recHolder') ev.record.holder = v;
          else if(f==='recYear') ev.record.year = v;
          else if(f==='recBetter') ev.record.better = v;
          else if(f==='recUnit') ev.record.unit = v;
          else ev[f] = v;
          markDirty(); render();
        };
      });
      box.querySelector('[data-a=up]').onclick = ()=>{ if(ei<1) return; const a=c.events;[a[ei],a[ei-1]]=[a[ei-1],a[ei]]; markDirty(); render(); };
      box.querySelector('[data-a=down]').onclick = ()=>{ const a=c.events; if(ei>=a.length-1) return; [a[ei],a[ei+1]]=[a[ei+1],a[ei]]; markDirty(); render(); };
      box.querySelector('[data-a=del]').onclick = ()=>{ if(!confirm(`刪除項目「${ev.name}」？`)) return; c.events=c.events.filter(x=>x.id!==ev.id); markDirty(); render(); };
      evHost.appendChild(box);
    });

    if(c.mode==='weighted'){
      const sum = c.events.reduce((a,e)=>a+(Number(e.weight)||0),0);
      if(Math.round(sum)!==100) p.querySelector('.panel-bd').appendChild(el(`<div class="rules" style="color:#c92f18">目前權重合計為 ${sum}%，不是 100%。積分仍會照設定計算，確認這是你要的。</div>`));
    }
    frag.appendChild(p);
  });

  const add = el(`<div class="panel"><div class="panel-bd" style="text-align:center">
    <button class="btn primary" id="addC">新增一個競賽（例如趣味競賽）</button></div></div>`);
  add.querySelector('#addC').onclick = ()=>{
    const name = prompt('競賽名稱','趣味競賽'); if(!name) return;
    const copy = confirm('要沿用「總名冊」裡全部隊伍當作參賽名單嗎？\n\n確定 = 全員先加入（之後可移除）\n取消 = 建立空名冊，自行挑選');
    S.data.competitions.push({ id:uid('c'), name, short:name, weight:1, mode:'sum', note:'', tieBreak:null,
      roster: copy ? S.data.teams.map(t=>({teamId:t.id,captain:'',contact:'',note:''})) : [],
      events:[ newEvent(name+'一', 100) ] });
    markDirty(); render();
  };
  frag.appendChild(add);
  return frag;
}

/* ---------- 連線與備份 ---------- */
function viewCloud(){
  const c = Store.cfg();
  const frag = document.createElement('div');
  frag.appendChild(el(`<details class="help"><summary>第一次設定？三分鐘完成雲端同步</summary><div class="in">
    <ol>
      <li>到 <a href="https://gist.github.com" target="_blank" rel="noopener">gist.github.com</a> 建立一個 Gist，檔名填 <code>scoreboard.json</code>，內容先填 <code>{}</code>，按 Create <b>secret</b> gist。</li>
      <li>複製網址最後那串英數字，就是 <b>Gist ID</b>，貼到下方欄位。</li>
      <li>到 GitHub → Settings → Developer settings → Tokens (classic) 建一個只勾 <code>gist</code> 權限的權杖，貼到下方。<b>只有需要改分數的工作人員才要填</b>，觀眾留空即可唯讀。</li>
      <li>按「測試並載入」。之後把這個 <code>index.html</code> 推到 GitHub 儲存庫，Settings → Pages 開啟，就有公開網址了。</li>
    </ol>
    <p>權杖只存在你這台裝置的瀏覽器裡，不會寫進網頁原始碼，也不會上傳到 Gist。</p>
  </div></details>`));

  const builtIn = DEFAULT_CFG.gistId ? `<div class="note">這個網址已內建 Gist ID，一般使用者不用改。</div>` : `<div class="note">同一場活動的所有人填同一組 ID</div>`;
  const p = el(`<div class="panel"><div class="panel-hd"><h2>雲端連線</h2>
      <span class="why">${Store.mode==='local'?'目前為本機模式，資料只存在這台裝置':'GitHub Gist · '+(c.token?'可編輯':'唯讀')}</span></div>
    <div class="panel-bd">
      <div class="cols">
        <div class="field"><label>Gist ID</label><input class="inp" id="c_gist" value="${esc(c.noCloud?'':(c.gistId||''))}" placeholder="留空 = 本機模式">
          ${builtIn}</div>
        <div class="field"><label>存取權杖（只有計分人員需要）</label><input class="inp" id="c_tok" type="password" value="${esc(c.token||'')}" placeholder="ghp_… 留空為唯讀">
        </div>
        <div class="field"><label>你的名字</label><input class="inp" id="c_who" value="${esc(c.who||'')}" placeholder="顯示在「最後更新」旁">
        </div>
        <div class="field"><label>自動檢查間隔（秒）</label><input class="inp" type="number" id="c_poll" value="${c.poll||10}" min="5">
          <div class="note">別人保存後，這個時間內就會同步過來</div></div>
      </div>
      <div id="rateBox"></div>
      <label class="chk" style="display:flex;margin-bottom:8px"><input type="checkbox" id="c_load" ${c.autoLoad?'checked':''}> 自動載入最新資料（沒有未保存變更時直接更新，不用按任何按鈕）</label>
      <label class="chk" style="display:flex;margin-bottom:14px"><input type="checkbox" id="c_auto" ${c.autoSave?'checked':''}> 自動保存（改動後 1.5 秒自動上傳，現場登記名次建議開啟）</label>
      <div class="tools" style="margin-left:0">
        <button class="btn primary" id="c_save">儲存設定並連線</button>
        <button class="btn" id="c_link">複製觀眾連結</button>
        <button class="btn" id="c_link2">複製計分人員連結</button>
        <button class="btn" id="c_init">用目前資料建立雲端初始版本</button>
      </div>
    </div></div>`);
  // 額度狀態
  const rb = p.querySelector('#rateBox');
  if(Store.mode==='gist'){
    const tok = !!c.token;
    const list = Object.values(Rate.buckets);
    const tight = tightestBucket();
    const low = tight && tight.limit && (tight.remaining / tight.limit) < 0.2;
    const rows = list.length
      ? list.map(b=>{
          const mins = Math.max(0, Math.ceil((b.reset - Date.now())/60000));
          const pctLeft = b.limit ? Math.round(b.remaining / b.limit * 100) : 0;
          return `<div style="margin-top:4px">· <b>${esc(RES_NAME[b.resource] || b.resource)}</b>　剩餘 <b>${b.remaining} / ${b.limit}</b>（${pctLeft}%）　約 ${mins} 分鐘後重置</div>`;
        }).join('')
      : '<div style="margin-top:4px">· 尚未取得額度資訊（送出第一個請求後才會顯示）</div>';
    rb.className = 'rules';
    const tone = !tok ? ['#f2c3bb','#fde8e4'] : (low ? ['#f0d79a','#fff8e6'] : ['#bfe5de','#e0f4f0']);
    rb.style.cssText = `margin:0 0 14px;border:1px solid ${tone[0]};border-radius:8px;background:${tone[1]}`;
    rb.innerHTML = (tok
        ? `<b>已認證</b>：額度依 GitHub 帳號計（不是依權杖）。GitHub 把額度<b>分成好幾個桶</b>，讀取與寫入各自獨立，所以下面的上限數字會不一樣，這是正常的。畫面沒變動時的檢查回傳 304，不扣額度。`
        : `<b>未認證（唯讀）</b>：每小時只有 60 次，而且是<b>整個對外 IP 共用</b> —— 同一個辦公室的所有人加起來算。本模式已自動把檢查間隔放慢到 120 秒。若現場人多，請改用權杖。`)
      + rows
      + (low ? `<div style="margin-top:6px;color:#96650a;font-weight:700">⚠ 「${esc(RES_NAME[tight.resource]||tight.resource)}」這個桶只剩 ${tight.remaining} 次，建議先關掉自動保存，改成手動按「保存」。</div>` : '');
  }

  p.querySelector('#c_save').onclick = ()=>{
    const gid = p.querySelector('#c_gist').value.trim();
    Store.saveCfg({
      gistId: gid,
      noCloud: !gid,
      token: p.querySelector('#c_tok').value.trim(),
      who: p.querySelector('#c_who').value.trim(),
      poll: Number(p.querySelector('#c_poll').value)||10,
      autoSave: p.querySelector('#c_auto').checked,
      autoLoad: p.querySelector('#c_load').checked,
      viewOnly: false,   // 手動填設定 = 自己要用的裝置，解除唯讀
    });
    S.etag=null; S.baseRev=0; startPolling(); pull(true); render();
  };
  const makeLink = async (readOnly)=>{
    const cur = Store.cfg();
    if(!cur.gistId){ toast('還沒有 Gist ID','bad'); return; }
    let url = location.origin + location.pathname + '?gist=' + encodeURIComponent(cur.gistId);
    if(cur.token) url += '&t=' + encodeURIComponent(cur.token);
    if(readOnly) url += '&ro=1';
    const msg = cur.token
      ? (readOnly ? '觀眾連結已複製。對方點開就能看，且不會誤改資料。' : '計分人員連結已複製，對方點開即可登錄成績。')
      : '連結已複製（未含權杖，對方仍會受每小時 60 次的 IP 共用限制）。';
    try{ await navigator.clipboard.writeText(url); toast(msg, cur.token?'good':'bad'); }
    catch{ prompt('複製這個連結分享出去：', url); }
  };
  p.querySelector('#c_link').onclick = ()=> makeLink(true);
  p.querySelector('#c_link2').onclick = ()=> makeLink(false);
  p.querySelector('#c_init').onclick = async ()=>{
    if(!confirm('會把目前畫面上的資料寫到雲端，覆蓋雲端現有內容。確定嗎？')) return;
    S.baseRev = 0; await push(false, true);
  };
  frag.appendChild(p);

  const log = (S.data.log || []).slice().reverse().slice(0, 12);
  const lp = el(`<div class="panel"><div class="panel-hd"><h2>最近更新紀錄</h2>
      <span class="why">誰在什麼時候改了哪一版</span></div>
    <div class="panel-bd">${ log.length
      ? log.map(x=>`<div class="logrow"><b>v${x.rev}</b><span class="who">${esc(x.by||'未署名')}</span><span style="color:var(--ink-3)">${fmt(x.at)}</span></div>`).join('')
      : '<div class="empty-state" style="padding:18px">還沒有任何保存紀錄</div>' }</div></div>`);
  frag.appendChild(lp);

  const b = el(`<div class="panel"><div class="panel-hd"><h2>備份與還原</h2>
      <span class="why">活動前後各匯出一次，最保險</span></div>
    <div class="panel-bd"><div class="tools" style="margin-left:0">
      <button class="btn" id="b_exp">匯出 JSON</button>
      <button class="btn" id="b_csv">匯出總表 CSV</button>
      <button class="btn" id="b_imp">匯入 JSON</button>
      <button class="btn" id="b_prev">還原被覆蓋的上一份</button>
      <button class="btn danger" id="b_reset">重設為範例資料</button>
      <input type="file" id="b_file" accept=".json,application/json" hidden>
    </div></div></div>`);
  b.querySelector('#b_exp').onclick = ()=> download('scoreboard-'+Date.now()+'.json', JSON.stringify(S.data,null,2), 'application/json');
  b.querySelector('#b_csv').onclick = ()=> download('scoreboard.csv', toCSV(), 'text/csv;charset=utf-8');
  b.querySelector('#b_imp').onclick = ()=> b.querySelector('#b_file').click();
  b.querySelector('#b_file').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ const d = normalize(JSON.parse(await f.text())); S.data = d; markDirty(); render(); toast('已匯入，記得按「保存」上傳','good'); }
    catch(err){ toast('檔案不是有效的 JSON','bad'); }
  };
  b.querySelector('#b_prev').onclick = ()=>{
    const raw = localStorage.getItem(LS.prev);
    if(!raw){ toast('沒有可還原的舊資料','bad'); return; }
    const o = JSON.parse(raw);
    if(!confirm(`還原成被覆蓋前的那一份？\n（v${o.rev} · ${fmt(o.updatedAt)} · ${o.teams?.length||0} 隊）\n還原後記得按「保存」才會上傳。`)) return;
    S.data = normalize(o); markDirty(); render(); toast('已還原，請確認後按保存','good');
  };
  b.querySelector('#b_reset').onclick = ()=>{ if(!confirm('會清掉目前所有成績，確定？')) return; S.data = normalize(defaultData()); markDirty(); render(); };
  frag.appendChild(b);
  return frag;
}
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+text], {type:mime}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function toCSV(){
  const lines = [];
  const q = s => '"' + String(s??'').replace(/"/g,'""') + '"';
  S.data.competitions.forEach(c=>{
    const teams = boardTeams(c), n = compSize(c);
    lines.push(q(c.name));
    if(!teams.length){ lines.push(q('（無參賽隊伍）')); lines.push(''); return; }
    lines.push(['項目／隊伍', ...teams.map(t=>t.name)].map(q).join(','));
    lines.push(['本場隊長', ...teams.map(t=>contactChain(c,null,t.id,'captain'))].map(q).join(','));
    lines.push(['聯繫方式', ...teams.map(t=>contactChain(c,null,t.id,'contact'))].map(q).join(','));
    c.events.forEach(ev=>{
      lines.push([ev.name+' 名次', ...teams.map(t=>effRank(ev,t.id,n) ?? '')].map(q).join(','));
      lines.push([ev.name+' 積分', ...teams.map(t=>eventScore(ev,t.id,n) ?? '')].map(q).join(','));
    });
    const pl = compRanking(c);
    lines.push(['總積分', ...teams.map(t=>compTotal(c,t.id) ?? '')].map(q).join(','));
    lines.push(['名次', ...teams.map(t=>pl[t.id] ?? '')].map(q).join(','));
    lines.push('');
  });
  if(S.data.showOverall && S.data.competitions.length>1){
    const teams = overallOrdered(), pl = overallRanking();
    lines.push(q('綜合總冠軍'));
    lines.push(['項目／隊伍', ...teams.map(t=>t.name)].map(q).join(','));
    S.data.competitions.forEach(c=> lines.push([c.short||c.name, ...teams.map(t=>compTotal(c,t.id) ?? '')].map(q).join(',')));
    lines.push(['綜合積分', ...teams.map(t=>overallTotal(t.id) ?? '')].map(q).join(','));
    lines.push(['綜合名次', ...teams.map(t=>pl[t.id] ?? '')].map(q).join(','));
  }
  return lines.join('\n');
}

/* ---------- 啟動 ---------- */
$('#whoPill').onclick = ()=> showNameGate(false);
$('#dirtyPill').onclick = async ()=>{
  if(!S.dirty) return;
  if(!confirm('捨棄這台裝置上未保存的變更，改用雲端最新版本？')) return;
  S.dirty = false; S.remote = null; S.baseRev = 0; S.etag = null;
  renderBanner(); await pull(true);
};
$('#btnPull').onclick = ()=> pull(true);
$('#btnPush').onclick = ()=> push(false);
window.addEventListener('beforeunload', e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pull(false); });

(async function init(){
  adoptUrlParams();
  const cached = localStorage.getItem(LS.cache);
  S.data = normalize(cached ? JSON.parse(cached) : defaultData());
  S.baseRev = S.data.rev;
  render();
  if(Store.mode==='gist'){ await pull(false); startPolling(); }
  if(nameNeeded()) showNameGate(true);
  else { S.tab = 'board'; render(); }
  paintSync();
})();
</script>
