<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭日競賽計分總表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f5; --card:#ffffff; --ink:#0f1a2a; --ink-2:#4a5a70; --ink-3:#8494a8;
  --line:#d3dae4; --line-2:#e6eaf0;
  --coral:#e63b22; --coral-soft:#fde8e4;
  --teal:#0f8a7a; --teal-soft:#e0f4f0;
  --gold:#d9930d; --gold-soft:#fdf1d8;
  --blue:#1f4e9c; --blue-soft:#e6edf9;
  --shadow:0 1px 2px rgba(15,26,42,.08), 0 8px 24px -12px rgba(15,26,42,.18);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue)}
:focus-visible{outline:3px solid #1f4e9c;outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{text-align:right;line-height:1.3}
.stamp b{display:block;font-size:13px;font-weight:700}
.stamp span{font-size:11.5px;color:var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;box-shadow:0 0 0 3px var(--teal-soft)}
.dot.warn{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.dot.off{background:var(--ink-3);box-shadow:0 0 0 3px #e3e8ee}
.dot.bad{background:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}

.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:#c92f18}
.btn.ghost{border-style:dashed;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.icon{padding:5px 9px;font-size:14px;line-height:1}
.btn.danger{color:var(--coral);border-color:#f2c3bb}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.pill.dirty{background:var(--gold-soft);color:#96650a}
.pill.ro{background:#e8ebf0;color:var(--ink-2)}

/* ---------- tabs ---------- */
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:30}
.tabs-in{max-width:1500px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-weight:700;font-size:14.5px;color:var(--ink-2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
.tab .cnt{font-size:11px;color:var(--ink-3);font-weight:500}

/* ---------- layout ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:18px 16px 90px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel-hd{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-hd h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.01em}
.panel-hd .why{font-size:12.5px;color:var(--ink-3)}
.panel-bd{padding:16px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}

/* ---------- board (紙本樣式) ---------- */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
table.board th,table.board td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
table.board thead th{background:var(--blue);color:#fff;font-size:13.5px;font-weight:700;position:sticky;top:0;z-index:2;border-right-color:#3a67ae}
table.board th.rowhd{background:#f4f7fb;text-align:left;font-size:13.5px;font-weight:700;position:sticky;left:0;z-index:3;min-width:150px;border-right:2px solid var(--line)}
table.board thead th.rowhd{background:#153f80;color:#fff;z-index:4}
table.board td{font-size:17px;font-weight:700}
tr.r-rank td{background:#fbfcfe;color:var(--ink-2);font-size:15px}
tr.r-score td{background:#fff}
tr.r-total td{background:var(--coral-soft);font-size:19px;font-weight:900}
tr.r-place td{background:#fff5e0;font-size:19px;font-weight:900}
tr.r-total th.rowhd,tr.r-place th.rowhd{background:#fdf0ec}
.rowhd .w{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
td.p1{color:var(--gold)} td.p2{color:#6d7d90} td.p3{color:#9a6b3f}
td.empty{color:#c4ccd6;font-weight:400}
.medal{display:inline-block;margin-right:3px}
.teamcol .cap{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px}

/* ---------- order bar ---------- */
.orderbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#f7f9fc;border-bottom:1px solid var(--line-2)}
.ochip{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;font-weight:700}
.ochip button{width:24px;height:24px;border-radius:50%;color:var(--ink-2);font-size:13px;line-height:1}
.ochip button:hover{background:var(--line-2);color:var(--ink)}

/* ---------- generic table ---------- */
table.grid{border-collapse:collapse;width:100%;min-width:680px}
table.grid th{background:#f4f7fb;font-size:12.5px;color:var(--ink-2);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.grid tr:last-child td{border-bottom:0}
table.grid tr.dnf td{background:#fff6f4}
.tname{font-weight:700}
.inp{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:0}
.inp:focus{border-color:var(--blue)}
select.inp{padding:6px 6px}
.rankcell{display:flex;align-items:center;gap:8px}
select.rank{width:86px;font-weight:900;font-size:16px;text-align:center}
.scorebox{display:inline-block;min-width:54px;text-align:center;font-weight:900;font-size:17px;padding:3px 8px;border-radius:7px;background:var(--blue-soft);color:var(--blue)}
.scorebox.zero{background:#eef0f4;color:var(--ink-3)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}

/* ---------- quick entry ---------- */
.quick{padding:12px 16px;background:var(--teal-soft);border-bottom:1px solid #bfe5de}
.quick .lbl{font-size:12.5px;color:#0b6b5f;font-weight:700;margin-bottom:8px}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid #bfe5de;background:#fff;font-weight:700;font-size:14px}
.qchip:hover{border-color:var(--teal)}
.qchip.done{background:var(--teal);border-color:var(--teal);color:#fff}
.qchip .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:#0b6b5f;color:#fff;font-size:12px;font-weight:900}
.qchip .n.off{background:#e3ecea;color:#8aa39e}

/* ---------- banner / toast ---------- */
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;max-width:min(640px,calc(100vw - 24px));
  background:var(--ink);color:#fff;border-radius:12px;padding:13px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  box-shadow:0 12px 40px -8px rgba(15,26,42,.55)}
.banner b{font-size:14.5px}
.banner p{margin:2px 0 0;font-size:12.5px;color:#b9c6d6}
.banner .acts{margin-left:auto;display:flex;gap:8px}
.banner .btn{background:#2b3c52;border:1px solid #3d5070;color:#fff}
.banner .btn.primary{background:var(--coral);border-color:var(--coral)}
.toast{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast div{background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow)}
.toast div.bad{background:var(--coral)}
.toast div.good{background:var(--teal)}

/* ---------- misc ---------- */
.empty-state{padding:34px 16px;text-align:center;color:var(--ink-3)}
.empty-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.field .note{font-size:12px;color:var(--ink-3);margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}
.evt{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.evt-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#f7f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.evt-hd h3{margin:0;font-size:15px;font-weight:900}
.tagw{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:999px}
.rules{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding:9px 14px;background:#fcfdfe}
.kbd{background:#eef1f5;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px;font-weight:700}
details.help{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px;margin-bottom:18px}
details.help summary{padding:12px 0;font-weight:700;cursor:pointer;font-size:14px}
details.help .in{padding:0 0 14px;font-size:13.5px;color:var(--ink-2)}
details.help ol{padding-left:20px;margin:6px 0}
details.help li{margin-bottom:5px}
code{background:#eef1f5;padding:1px 5px;border-radius:4px;font-size:12.5px}

/* 頒獎進度 */
.awprog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2);background:#f7f9fc}
.awprog .num{font-size:15px;font-weight:900}
.awprog .track{flex:1;min-width:160px;height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.awprog .fill{height:100%;background:var(--teal);border-radius:999px;transition:width .25s}
.awprog .fill.all{background:var(--gold)}
.awdone-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.awdone-btn:hover{border-color:var(--teal);color:var(--teal)}
.awdone-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
tr.awdone > *{opacity:.42}
tr.awdone{background:#f4f6f8!important}
tr.awdone .rowhd{text-decoration:line-through;text-decoration-thickness:1.5px}
tr.awdone .awdone-btn{opacity:1}
tr.awnext > *{box-shadow:inset 0 2px 0 var(--coral),inset 0 -2px 0 var(--coral)}
tr.awnext > *:first-child{box-shadow:inset 2px 0 0 var(--coral),inset 0 2px 0 var(--coral),inset 0 -2px 0 var(--coral)}
tr.awnext > *:last-child{box-shadow:inset -2px 0 0 var(--coral),inset 0 2px 0 var(--coral),inset 0 -2px 0 var(--coral)}
.nextflag{display:inline-block;background:var(--coral);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:middle}

/* 名次防呆標記 */
.rmk{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;
  border-radius:8px;font-size:15px;font-weight:900;flex:none;line-height:1}
.rmk.m1{background:#fdf1d8;color:#c8910b}
.rmk.m2{background:#eef1f5;color:#78848f}
.rmk.m3{background:#f7ece1;color:#a2682d}
.rmk.ok{background:var(--teal-soft);color:var(--teal)}
.rmk.dup{background:var(--coral-soft);color:var(--coral)}
.rmk.over{background:var(--gold-soft);color:#96650a}
.rmk.none{background:#eef1f5;color:#aab4c0;font-weight:700}
.rmk.stop{background:var(--coral-soft);color:var(--coral);font-size:12px;font-weight:700}
select.rank.err{border-color:var(--coral);background:#fff5f3}
select.rank.warn{border-color:var(--gold);background:#fffaf0}
.auditbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:13px;
  border-bottom:1px solid var(--line-2)}
.auditbar.good{background:var(--teal-soft);border-bottom-color:#bfe5de;color:#0b6b5f}
.auditbar.bad{background:#fff5f3;border-bottom-color:#f2c3bb;color:#c92f18}
.auditbar b{font-weight:900}
.auditbar .pg{font-weight:900;color:var(--ink)}

/* 獎次徽章（金銀銅） */
.mdl{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:23px;white-space:nowrap;line-height:1.25}
.mdl .em{font-size:1.05em}
.mdl.g{color:#c8910b}
.mdl.s{color:#78848f}
.mdl.b{color:#a2682d}
.mdl.rec{color:#c8910b;font-size:19px}
.mdl.none{color:var(--ink-3);font-size:15px;font-weight:700}
.mdl.sm{font-size:17px}
.mdl.sm.rec,.mdl.sm.none{font-size:14px}
td.mcell{text-align:center;vertical-align:middle}
tr.aw1{background:#fffaf0}
tr.aw2{background:#f7f9fb}
tr.aw3{background:#fdf7f1}
body.big .mdl{font-size:34px}
body.big .mdl.rec{font-size:27px}

/* 歷年紀錄比較 */
.recbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;background:#f2f7ff;border-bottom:1px solid #cfe0f7;font-size:13px}
.recbar b{font-weight:900}
.recbar .old{color:var(--blue);font-weight:700}
.recbar.broke{background:#fff8e6;border-bottom-color:#f0d79a}
.recbar.broke .tag{background:var(--gold);color:#fff;padding:3px 10px;border-radius:999px;font-weight:900;font-size:12.5px}
.recbar .none{color:var(--ink-3)}
.perf{width:110px;font-weight:700;text-align:center}
.perf.best{border-color:var(--gold);background:#fffaf0}
.brk{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:900;color:var(--gold)}

/* 拖曳排序 */
.dragh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink-3);
  font-size:15px;line-height:1;padding:5px 7px;border-radius:6px}
.dragh:hover{background:var(--line-2);color:var(--ink)}
.dragh:active{cursor:grabbing}
tr.dragging{background:var(--blue-soft)!important;outline:2px solid var(--blue);outline-offset:-2px}
tr.dragging td,tr.dragging th{opacity:.92}
.ochip.dragging{background:var(--blue-soft);border-color:var(--blue);outline:2px solid var(--blue)}
.ochip .dragh{padding:3px 5px}
.sorthint{font-size:12px;color:var(--ink-3);padding:8px 16px 0}

/* 分頁下拉選單 */
.menu{position:relative;display:inline-flex}
.tab.drop{display:inline-flex;align-items:center;gap:6px;max-width:260px}
.tab.drop .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.drop .car{font-size:10px;opacity:.6;flex:none}
.tab.drop[aria-expanded="true"]{color:var(--coral)}
.menu-pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 32px -8px rgba(15,26,42,.28);min-width:240px;max-height:min(62vh,420px);
  overflow:auto;padding:6px}
.menu-pop .sec{padding:7px 10px 4px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.menu-pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:7px;
  font-size:14px;font-weight:600;color:var(--ink)}
.menu-pop button:hover{background:#f1f5fa}
.menu-pop button[aria-current="true"]{background:var(--coral-soft);color:var(--coral);font-weight:800}
.menu-pop button .sub{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:500}
.menu-pop button[aria-current="true"] .sub{color:var(--coral);opacity:.75}

/* 手寫板照片 */
.photos{display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px}
.pcard{width:190px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.pcard img{display:block;width:100%;height:130px;object-fit:cover;cursor:zoom-in;background:#eef1f5}
.pcard .meta{padding:7px 9px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.pcard .meta b{color:var(--ink-2);font-size:12px;font-weight:700}
.pcard .meta button{margin-left:auto;color:var(--coral);font-size:12px;font-weight:700}
.pdrop{width:190px;height:172px;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:13px;font-weight:700;background:#fafbfd}
.pdrop:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.pdrop .big{font-size:26px;line-height:1}
.pbar{padding:11px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line-2);background:#f7f9fc}
.pbar .sz{font-size:12px;color:var(--ink-3)}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(15,26,42,.9);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .cap{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:13px}

/* 署名對話框 */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(15,26,42,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--card);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 24px 60px -12px rgba(15,26,42,.5)}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:900}
.modal p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.modal .inp{font-size:17px;padding:10px 12px;font-weight:700}
.modal .acts{display:flex;gap:8px;margin-top:14px}
.modal .acts .btn{flex:1}
.modal .tiny{margin:12px 0 0;font-size:12px;color:var(--ink-3)}
.modal .err{color:var(--coral);font-weight:700;font-size:12.5px;margin:6px 0 0}
#whoPill{background:var(--teal-soft);color:var(--teal);cursor:pointer;border:0}
#whoPill:hover{background:#cfeee7}
.logrow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.logrow:last-child{border-bottom:0}
.logrow b{min-width:52px;font-size:12px;color:var(--ink-3);font-weight:700}
.logrow .who{font-weight:700}

/* 大字 / 投影模式 */
body.big{font-size:17px}
body.big table.board td{font-size:26px;padding:13px 14px}
body.big tr.r-total td,body.big tr.r-place td{font-size:32px}
body.big table.board thead th{font-size:17px}
body.big table.board th.rowhd{font-size:16px}

<script>
"use strict";
/* ============================================================
   家庭日競賽計分板 · 單檔版
   儲存後端：GitHub Gist（可換成任何 JSON 服務，見 Store 區塊）
   ============================================================ */

/* ============================================================
   ★ 部署前只要改這一行 ★
   把你的 Gist ID 填進去，之後任何人打開網址就自動連上、自動同步，
   不用再一台一台設定。Gist ID 不是密碼，可以安全寫在這裡。
   （權杖 token 千萬不要寫在這裡 —— 見 README 說明）
   ============================================================ */
const DEFAULT_CFG = {
  gistId: 'e4e1649856a2c1bdc6ba05b864adcc53',     // 例：'a1b2c3d4e5f60718293a4b5c6d7e8f90'
  poll: 15,       // 背景檢查間隔（秒）
  autoLoad: true, // 沒有未保存變更時，自動套用別人的更新
};

const LS = {
  cfg:'fd_cfg_v1',      // 連線設定（gistId / token / 名字），只存在本機
  cache:'fd_cache_v1',  // 離線快取 + 本機模式資料
  prev:'fd_prev_v1',    // 被雲端覆蓋前的上一份，供緊急還原
};
const FILENAME = 'scoreboard.json';
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ---------- 預設資料（比照現場紙本板） ---------- */
function defaultData(){
  const names = ['RTK_Fatout','Display_Bon','狂賀!順子晉升軟體總監','整個跑起來不太隊','來都來了','大展鴻圖','SMC_性價比突破天際','肌肉胖子'];
  const teams = names.map(n => ({ id:uid('t'), name:n, captain:'', contact:'', note:'' }));
  const ev = (name, weight, scores, tail) => newEvent(name, weight, scores, tail);
  const roster = () => teams.map(t => ({ teamId:t.id, captain:'', contact:'', note:'' }));
  return {
    schema: 1,
    rev: 1,
    updatedAt: new Date().toISOString(),
    updatedBy: '系統',
    title: '瑞昱39 家庭日 · 競賽計分總表',
    subtitle: '歡樂無限 · 團隊攜手向前衝',
    showOverall: true,
    teams,
    competitions: [
      {
        id: uid('c'), name:'瑞昱最強鐵人三項爭霸賽', short:'鐵人三項', weight:1, mode:'weighted',
        note:'三項競賽依名次給予權重積分，加總後為隊伍分數，分數最高者為冠軍。',
        roster: roster(),
        events: [
          ev('極限衝鋒', 30, [100,85,70,60,55,50,40,35], 35),
          ev('力拔山河', 30, [100,85,70,60,55,55,55,55], 55),
          ev('1200公尺大隊接力', 40, [100,85,70,60,55,50,40,35], 35),
        ],
        tieBreak:null,
      },
      {
        id: uid('c'), name:'趣味競賽', short:'趣味競賽', weight:1, mode:'sum',
        note:'每項取前三名給分，三項累加為趣味競賽總分。',
        roster: roster(),
        events: [
          ev('趣味競賽一', 100, [100,85,70], 0),
          ev('趣味競賽二', 100, [100,85,70], 0),
          ev('趣味競賽三', 100, [100,85,70], 0),
        ],
        tieBreak:null,
      },
    ],
  };
}
// 鐵人三項同分時以「1200公尺大隊接力」勝負為依據
(function(){ /* 由 normalize 補上 tieBreak */ })();

/** 建立新項目：集中在一處，避免漏掉欄位造成畫面崩掉 */
function newEvent(name, weight, scores, tail){
  return { id:uid('e'), name, weight: weight ?? 0, scores: scores || [100,85,70], tail: tail ?? 0,
           entries:{}, record:{ on:false, better:'min', value:'', holder:'', year:'', unit:'秒' } };
}

function normalize(d){
  d.teams ||= []; d.competitions ||= []; d.log ||= [];
  d.photoGistId ||= ''; d.photoRev ??= 0;
  d.awards ||= [];
  d.awards.forEach(a=>{ a.source ||= 'comp'; a.place ??= 1; a.presenter ??= ''; a.note ??= ''; a.title ??= ''; a.done ??= false; });
  const ids = new Set(d.teams.map(t=>t.id));
  d.competitions.forEach(c=>{
    // 舊版沒有名冊 → 預設全員參賽，並把當時的隊長資訊帶進來
    if(!Array.isArray(c.roster)) c.roster = d.teams.map(t=>({ teamId:t.id, captain:t.captain||'', contact:t.contact||'', note:'' }));
    c.roster = c.roster.filter(r=>ids.has(r.teamId));
    c.roster.forEach(r=>{ r.captain ??= ''; r.contact ??= ''; r.note ??= ''; });
    c.events ||= []; c.mode ||= 'weighted'; c.weight ??= 1;
    c.events.forEach(e=>{
      e.entries ||= {}; e.scores ||= [100,85,70]; e.tail ??= 0; e.weight ??= 100;
      e.record ||= { on:false, better:'min', value:'', holder:'', year:'', unit:'秒' };
      Object.values(e.entries).forEach(en=>{ en.perf ??= ''; });
    });
    if(c.tieBreak===undefined) c.tieBreak = null;
    if(c.tieBreak===null && c.events.length>1 && /鐵人|三項/.test(c.name)){
      const relay = c.events.find(e=>/接力/.test(e.name));
      if(relay) c.tieBreak = relay.id;
    }
    if(c.tieBreak && !c.events.some(e=>e.id===c.tieBreak)) c.tieBreak=null;
  });
  return d;
}

/* ============================================================
   Store：雲端儲存層
   目前實作 GitHub Gist。要換別的後端，只要改這三個方法即可。
   ============================================================ */
/* ---- API 額度追蹤 ---- */
/* GitHub 的額度是「分桶」的：讀取、寫入等不同資源各有各的上限，
   回應標頭 x-ratelimit-resource 會標明這次算在哪個桶，所以分開記錄才不會互相蓋掉。 */
const Rate = { buckets:{}, last:null, blockedUntil:0 };
function noteRate(r){
  const g = k => r.headers.get(k);
  if(g('x-ratelimit-limit') == null) return;
  const res = g('x-ratelimit-resource') || 'core';
  const b = {
    resource: res,
    limit: Number(g('x-ratelimit-limit')),
    remaining: Number(g('x-ratelimit-remaining')),
    reset: Number(g('x-ratelimit-reset')) * 1000,
    at: Date.now(),
  };
  Rate.buckets[res] = b;
  Rate.last = b;
}
const RES_NAME = { core:'一般 API', graphql:'GraphQL', search:'搜尋', integration_manifest:'App', code_search:'程式碼搜尋' };
/** 目前最吃緊的那個桶 */
function tightestBucket(){
  const all = Object.values(Rate.buckets);
  if(!all.length) return null;
  return all.slice().sort((a,b)=> (a.remaining/a.limit) - (b.remaining/b.limit))[0];
}
class RateError extends Error {
  constructor(r){
    const reset = Number(r.headers.get('x-ratelimit-reset')) * 1000 || (Date.now()+600000);
    Rate.blockedUntil = reset;
    const mins = Math.max(1, Math.ceil((reset - Date.now())/60000));
    super(`已達 GitHub API 次數上限，約 ${mins} 分鐘後恢復` + (Store.cfg().token ? '' : '。請在「連線與備份」填入權杖可大幅提高上限'));
    this.name = 'RateError';
  }
}

const Store = {
  /** 優先序：內建預設 → 這台裝置的設定 → 網址參數 ?gist=xxx */
  cfg(){
    let u = {}; try{ u = JSON.parse(localStorage.getItem(LS.cfg)) || {}; }catch{}
    const c = Object.assign({}, DEFAULT_CFG, u);
    const q = new URLSearchParams(location.search);
    if(q.get('gist')){ c.gistId = q.get('gist').trim(); c.noCloud = false; }
    if(c.autoLoad === undefined) c.autoLoad = true;
    return c;
  },
  saveCfg(c){ localStorage.setItem(LS.cfg, JSON.stringify(c)); },
  get mode(){ const c=this.cfg(); return (!c.noCloud && c.gistId) ? 'gist' : 'local'; },
  get canWrite(){ const c=this.cfg(); return this.mode==='local' ? !c.viewOnly : (!!c.token && !c.viewOnly); },

  async read(etag){
    const c = this.cfg();
    if(this.mode==='local'){
      const raw = localStorage.getItem(LS.cache);
      return { data: raw ? JSON.parse(raw) : null, etag:null };
    }
    const h = { 'Accept':'application/vnd.github+json' };
    if(c.token) h.Authorization = 'Bearer ' + c.token;
    if(etag) h['If-None-Match'] = etag;
    const r = await fetch('https://api.github.com/gists/' + c.gistId, { headers:h, cache:'no-store' });
    noteRate(r);
    if(r.status === 304) return { notModified:true };
    if(r.status === 429 || (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0')) throw new RateError(r);
    if(r.status === 401) throw new Error('權杖無效或已過期，請到「連線與備份」重新填寫');
    if(r.status === 403) throw new Error('沒有存取權限（403），請確認權杖有勾選 gist 權限');
    if(r.status === 404) throw new Error('找不到這個 Gist，請確認 Gist ID');
    if(!r.ok) throw new Error('讀取失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    const f = j.files && (j.files[FILENAME] || Object.values(j.files)[0]);
    if(!f) throw new Error('Gist 裡沒有檔案，請先放一個 ' + FILENAME);
    let content = f.content;
    if(f.truncated && f.raw_url) content = await (await fetch(f.raw_url)).text();
    return { data: content ? JSON.parse(content) : null, etag: r.headers.get('ETag') };
  },

  async write(data){
    const c = this.cfg();
    if(this.mode==='local'){ localStorage.setItem(LS.cache, JSON.stringify(data)); return { etag:null }; }
    if(!c.token) throw new Error('沒有權杖，無法寫入雲端');
    const r = await fetch('https://api.github.com/gists/' + c.gistId, {
      method:'PATCH',
      headers:{ 'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+c.token, 'Content-Type':'application/json' },
      body: JSON.stringify({ files: { [FILENAME]: { content: JSON.stringify(data, null, 2) } } })
    });
    noteRate(r);
    if(r.status === 429 || (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0')) throw new RateError(r);
    if(!r.ok) throw new Error('保存失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    return { etag: r.headers.get('ETag'), data: JSON.parse((j.files[FILENAME]||Object.values(j.files)[0]).content) };
  },
};

/** 分享連結帶來的設定：?gist=ID&t=權杖&ro=1(唯讀)
 *  收下後立刻寫進本機並清掉網址列，避免權杖留在畫面、書籤或截圖裡 */
function adoptUrlParams(){
  const q = new URLSearchParams(location.search);
  if(!q.has('gist') && !q.has('t')) return;
  let cur = {}; try{ cur = JSON.parse(localStorage.getItem(LS.cfg)) || {}; }catch{}
  if(q.get('gist')){ cur.gistId = q.get('gist').trim(); cur.noCloud = false; }
  if(q.get('t')) cur.token = q.get('t').trim();
  cur.viewOnly = q.get('ro') === '1';
  if(cur.autoLoad === undefined) cur.autoLoad = true;
  if(cur.poll === undefined) cur.poll = DEFAULT_CFG.poll;
  Store.saveCfg(cur);
  try{ history.replaceState(null, '', location.pathname); }catch{}
}

/* ---------- 全域狀態 ---------- */
const S = {
  data: null,
  baseRev: 0,        // 上次同步到的版本
  synced: false,     // 是否真的從雲端載入過（避免與本機預設版本號撞號）
  etag: null,
  dirty: false,
  tab: 'board',
  sortMode: 'custom', // custom | rank
  boardView: 'auto',  // auto | table | cards（手機預設走卡片）
  awardMode: 'edit',  // edit | view
  remote: null,       // 偵測到的較新遠端資料
  polling: null,
  saving: false,
  lastErr: '',
};

/* ---------- 名次防呆檢查 ---------- */
/** 掃出重複、跳號、超出隊數、未登錄 */
function rankAudit(ev, roster){
  const n = roster.length;
  const byRank = {};
  let filled = 0, dnf = 0, blank = [];
  roster.forEach(t=>{
    const en = ev.entries[t.id] || {};
    if(en.dnf){ dnf++; return; }
    const r = en.rank;
    if(r == null){ blank.push(t); return; }
    filled++;
    (byRank[r] ||= []).push(t);
  });
  const dupes = Object.entries(byRank).filter(([,v]) => v.length > 1)
                      .map(([r,v]) => ({ rank:Number(r), teams:v }));
  const over = Object.entries(byRank).filter(([r]) => Number(r) > n)
                      .flatMap(([r,v]) => v.map(t => ({ team:t, rank:Number(r) })));
  const used = Object.keys(byRank).map(Number);
  const max = used.length ? Math.max(...used) : 0;
  const missing = [];
  // 只檢查到參賽隊數為止，避免有人誤填大數字時跳出一長串「缺少第 N 名」
  for(let i = 1; i <= Math.min(max, n); i++) if(!used.includes(i)) missing.push(i);
  return { n, filled, dnf, blank, dupes, over, missing,
           ok: filled + dnf === n && !dupes.length && !over.length && !missing.length };
}
/** 每一列名次旁的標記 */
function rankMark(ev, t, audit){
  const en = ev.entries[t.id] || {};
  if(en.dnf) return `<span class="rmk stop" title="中止競賽，以最後一名計分">中止</span>`;
  const r = en.rank;
  if(r == null) return `<span class="rmk none" title="尚未登錄名次">—</span>`;
  if(audit.dupes.some(d => d.rank === r)) return `<span class="rmk dup" title="這個名次有兩隊以上，請確認">⚠</span>`;
  if(r > audit.n) return `<span class="rmk over" title="超過參賽隊數 ${audit.n}">⚠</span>`;
  if(r === 1) return `<span class="rmk m1" title="冠軍">🥇</span>`;
  if(r === 2) return `<span class="rmk m2" title="亞軍">🥈</span>`;
  if(r === 3) return `<span class="rmk m3" title="季軍">🥉</span>`;
  return `<span class="rmk ok" title="已登錄">✓</span>`;
}

/* ---------- 歷年紀錄比較 ---------- */
/** 接受 0'41"79、1'09"58、41"79、1:09.58、41.79、41；空白 null、格式錯 NaN */
function parsePerf(str){
  if(str == null) return null;
  let v = String(str).trim();
  if(!v) return null;
  v = v.replace(/[’‘´`′]/g, "'").replace(/[”“″]/g, '"').replace(/\s+/g, '');
  let m;
  if((m = v.match(/^(\d+)['：:](\d{1,2})(?:["'.,](\d{1,3}))?$/))) return +m[1]*60 + +m[2] + (m[3] ? +('0.'+m[3]) : 0);
  if((m = v.match(/^(\d+)"(\d{1,3})$/)))                       return +m[1] + +('0.'+m[2]);
  if((m = v.match(/^(\d+)(?:[.,](\d{1,3}))?$/)))               return +m[1] + (m[2] ? +('0.'+m[2]) : 0);
  return NaN;
}
/** 秒數 → 0'41"79；非計時單位就原樣顯示數字 */
function fmtPerf(v, ev){
  if(v == null || isNaN(v)) return '';
  if(ev && ev.record && ev.record.better === 'max') return String(v);
  const m = Math.floor(v/60);
  return m + "'" + (v - m*60).toFixed(2).padStart(5,'0').replace('.', '"');
}
/** 這個項目的破紀錄狀況 */
function recordState(ev, c){
  const r = ev.record || {};
  const out = { on:!!r.on, rec:parsePerf(r.value), better:r.better||'min', best:null, bestTeams:[], broke:[], diff:0 };
  if(!out.on) return out;
  const teams = c ? rosterTeams(c) : S.data.teams;
  const rows = teams.map(t=>({ t, v: parsePerf((ev.entries[t.id]||{}).perf) }))
                    .filter(x => x.v != null && !isNaN(x.v));
  if(!rows.length) return out;
  const cmp = out.better === 'max' ? (a,b)=> b.v - a.v : (a,b)=> a.v - b.v;
  rows.sort(cmp);
  out.best = rows[0].v;
  out.bestTeams = rows.filter(x => x.v === out.best).map(x => x.t);
  if(out.rec != null && !isNaN(out.rec)){
    const beats = v => out.better === 'max' ? v > out.rec : v < out.rec;
    out.broke = rows.filter(x => beats(x.v)).map(x => x.t);
    if(out.broke.length) out.diff = Math.abs(out.best - out.rec);
  }
  return out;
}
/** 全場破紀錄清單，供頒獎典禮使用 */
function brokenRecords(){
  const list = [];
  S.data.competitions.forEach(c => c.events.forEach(ev=>{
    const st = recordState(ev, c);
    if(st.on && st.broke.length) list.push({ c, ev, st });
  }));
  return list;
}

/* ---------- 計分核心 ---------- */
function scoreOf(ev, rank, teamCount){
  if(rank == null) return null;
  const arr = ev.scores || [];
  if(rank >= 1 && rank <= arr.length) return Number(arr[rank-1]) || 0;
  return Number(ev.tail) || 0;
}
/* --- 名冊 --- */
const teamById = id => S.data.teams.find(t=>t.id===id);
function rosterTeams(c){ return (c.roster||[]).map(r=>teamById(r.teamId)).filter(Boolean); }
function rinfo(c, teamId){ return (c.roster||[]).find(r=>r.teamId===teamId) || {}; }
function compSize(c){ return rosterTeams(c).length; }
function inRoster(c, teamId){ return (c.roster||[]).some(r=>r.teamId===teamId); }
/** 該隊在這場競賽的隊長／聯繫方式：項目層 → 競賽名冊層 → 總名冊預設 */
function contactChain(c, ev, teamId, field){
  const en = ev && ev.entries[teamId];
  if(en && en[field]) return en[field];
  const r = rinfo(c, teamId);
  if(r[field]) return r[field];
  return (teamById(teamId)||{})[field] || '';
}

function entryOf(ev, teamId){ return (ev.entries[teamId] ||= { rank:null, dnf:false, captain:'', contact:'', note:'', perf:'' }); }
function effRank(ev, teamId, teamCount){
  const en = ev.entries[teamId];
  if(!en) return null;
  if(en.dnf) return teamCount;          // 中止競賽 → 以該項目最後一名計分
  return en.rank ?? null;
}
function eventScore(ev, teamId, teamCount){
  return scoreOf(ev, effRank(ev, teamId, teamCount), teamCount);
}
function compTotal(c, teamId){
  if(!inRoster(c, teamId)) return null;
  const n = compSize(c);
  let sum = 0, any = false;
  c.events.forEach(ev=>{
    const s = eventScore(ev, teamId, n);
    if(s != null){ any = true; sum += s * (Number(ev.weight)||0) / 100; }
  });
  return any ? Math.round(sum*100)/100 : null;
}
function compRanking(c){
  const teams = rosterTeams(c), n = teams.length;
  const tbEv = c.tieBreak ? c.events.find(e=>e.id===c.tieBreak) : null;
  const rows = teams.map(t=>({ id:t.id, total: compTotal(c,t.id) ?? -1,
    tb: tbEv ? (effRank(tbEv, t.id, n) ?? 999) : 999 }));
  rows.sort((a,b)=> b.total - a.total || a.tb - b.tb);
  const place = {}; let last=null, lastPlace=0;
  rows.forEach((r,i)=>{
    const key = r.total + '|' + (tbEv ? r.tb : '');
    if(key === last) place[r.id] = lastPlace;
    else { place[r.id] = i+1; last = key; lastPlace = i+1; }
  });
  return place;
}
/** 綜合總表只收「至少參加過一場競賽」的隊伍 */
function overallTeams(){
  return S.data.teams.filter(t => S.data.competitions.some(c=>inRoster(c,t.id)));
}
function overallTotal(teamId){
  let sum=0, any=false;
  S.data.competitions.forEach(c=>{
    const t = compTotal(c, teamId);
    if(t!=null){ any=true; sum += t * (Number(c.weight)||0); }
  });
  return any ? Math.round(sum*100)/100 : null;
}
function overallRanking(){
  const rows = overallTeams().map(t=>({id:t.id, total: overallTotal(t.id) ?? -1}));
  rows.sort((a,b)=>b.total-a.total);
  const place={}; let last=null,lp=0;
  rows.forEach((r,i)=>{ if(r.total===last) place[r.id]=lp; else {place[r.id]=i+1; last=r.total; lp=i+1;} });
  return place;
}
/** 單場競賽的欄位順序（自訂 = 名冊順序） */
function boardTeams(c){
  const teams = rosterTeams(c);
  if(S.sortMode==='rank'){ const p = compRanking(c); return [...teams].sort((a,b)=>(p[a.id]||99)-(p[b.id]||99)); }
  return teams;
}
function overallOrdered(){
  const teams = overallTeams();
  if(S.sortMode==='rank'){ const p = overallRanking(); return [...teams].sort((a,b)=>(p[a.id]||99)-(p[b.id]||99)); }
  return teams;
}
/** 從某場競賽名冊移除隊伍，連同該場成績 */
function removeFromRoster(c, teamId){
  c.roster = c.roster.filter(r=>r.teamId!==teamId);
  c.events.forEach(ev=>{ delete ev.entries[teamId]; });
}

/* ============================================================
   手寫板照片：存在「另一個 Gist」，與主資料分開
   主資料每 10 秒就被每台裝置抓一次，照片放進去會把流量撐爆，
   所以照片只在 photoRev 變動時才下載。相簿 Gist 第一次上傳時自動建立。
   ============================================================ */
const PHOTO_FILE = 'photos.json';
const Photos = {
  cache: { rev:-1, data:null },
  loading: false,

  /** 壓縮成長邊 1600、JPEG，必要時再降品質，避免單張破 700KB */
  compress(file){
    return new Promise((res, rej)=>{
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = ()=>{
        const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let q = 0.72, out = cv.toDataURL('image/jpeg', q);
        while(out.length > 700000 && q > 0.35){ q -= 0.08; out = cv.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url);
        res(out);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('這個檔案不是圖片，或瀏覽器讀不到')); };
      img.src = url;
    });
  },

  async load(force){
    const gid = S.data.photoGistId;
    if(!gid) return {};
    if(!force && this.cache.data && this.cache.rev === S.data.photoRev) return this.cache.data;
    const c = Store.cfg();
    const h = { 'Accept':'application/vnd.github+json' };
    if(c.token) h.Authorization = 'Bearer ' + c.token;
    const r = await fetch('https://api.github.com/gists/' + gid, { headers:h, cache:'no-store' });
    noteRate(r);
    if(r.status === 429 || (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0')) throw new RateError(r);
    if(!r.ok) throw new Error('讀取照片失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    const f = j.files && (j.files[PHOTO_FILE] || Object.values(j.files)[0]);
    let content = f ? f.content : '{}';
    if(f && f.truncated && f.raw_url) content = await (await fetch(f.raw_url)).text();
    const data = JSON.parse(content || '{}');
    this.cache = { rev:S.data.photoRev, data };
    return data;
  },

  async save(all){
    const c = Store.cfg();
    if(!c.token) throw new Error('唯讀模式無法上傳照片');
    const size = JSON.stringify(all).length;
    if(size > 6e6) throw new Error('相簿已接近容量上限，請先刪掉幾張舊照片');
    const headers = { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+c.token, 'Content-Type':'application/json' };
    const files = { [PHOTO_FILE]: { content: JSON.stringify(all) } };
    let r;
    if(S.data.photoGistId){
      r = await fetch('https://api.github.com/gists/' + S.data.photoGistId, { method:'PATCH', headers, body:JSON.stringify({ files }) });
    } else {
      r = await fetch('https://api.github.com/gists', { method:'POST', headers,
        body: JSON.stringify({ files, public:false, description:'家庭日計分板 · 手寫板照片' }) });
    }
    noteRate(r);
    if(!r.ok) throw new Error('照片上傳失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    S.data.photoGistId = j.id;
    S.data.photoRev = (Number(S.data.photoRev)||0) + 1;
    this.cache = { rev:S.data.photoRev, data:all };
    markDirty();
    await push(true);            // 主資料帶著新的 photoRev 上傳，其他裝置才知道要重抓
  },
};

/* ---------- 同步 ---------- */
let roWarnAt = 0;
function markDirty(){
  if(!Store.canWrite){                     // 唯讀裝置：不記錄變更，也不要嚇使用者
    if(Date.now() - roWarnAt > 6000){ roWarnAt = Date.now(); toast('唯讀模式，這項變更不會被保存','bad'); }
    return;
  }
  S.dirty = true; paintSync(); scheduleAuto();
}
let autoT = null, lastAutoPush = 0, lowWarnAt = 0;
function scheduleAuto(){
  const c = Store.cfg();
  if(!c.autoSave || !Store.canWrite) return;
  // 額度快見底時停止自動保存，改由人工決定何時送出
  const tight = tightestBucket();
  if(tight && tight.limit && tight.remaining <= Math.max(5, tight.limit * 0.05)){
    if(Date.now() - lowWarnAt > 60000){
      lowWarnAt = Date.now();
      toast(`API 額度只剩 ${tight.remaining} 次，已暫停自動保存，請手動按「保存」`, 'bad');
    }
    return;
  }
  clearTimeout(autoT);
  // 連續編輯時至少間隔 6 秒才送一次，避免每改一格就打一次 API
  const wait = Math.max(1500, 6000 - (Date.now() - lastAutoPush));
  autoT = setTimeout(()=>{ lastAutoPush = Date.now(); push(true); }, wait);
}
function fmt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function paintSync(){
  const dot = $('#dot'), t = $('#stampTime'), w = $('#stampWho');
  $('#dirtyPill').hidden = !S.dirty;
  $('#modePill').hidden = Store.canWrite;
  const who = Store.cfg().who;
  const wp = $('#whoPill');
  wp.hidden = !(Store.canWrite && who);
  if(who) wp.textContent = '我是 ' + who;
  $('#btnPush').disabled = !Store.canWrite || S.saving;
  if(S.lastErr){ dot.className='dot bad'; t.textContent='同步異常'; w.textContent=S.lastErr; return; }
  if(!S.data){ dot.className='dot off'; return; }
  dot.className = 'dot' + (S.remote ? ' warn' : S.dirty ? ' warn' : '');
  t.textContent = '最後更新 ' + fmt(S.data.updatedAt);
  w.textContent = (S.data.updatedBy ? '由 ' + S.data.updatedBy : '') + ' · v' + S.data.rev + (Store.mode==='local'?' · 本機模式':'');
}
/** 可修改資料的裝置必須先登記姓名，否則更新紀錄看不出是誰 */
function nameNeeded(){ return Store.canWrite && Store.mode === 'gist' && !Store.cfg().who; }
function showNameGate(force){
  if($('#nameGate')) return;
  const cur = Store.cfg().who || '';
  const ov = el(`<div class="overlay" id="nameGate"><div class="modal">
      <h3>${force ? '請先登記你是誰' : '更改署名'}</h3>
      <p>${force ? '這台裝置可以修改成績。每次保存都會記下是誰改的，方便現場對帳、也避免改錯了找不到人。' : '之後的保存會以這個名字記錄。'}</p>
      <input class="inp" id="nameIn" value="${esc(cur)}" placeholder="例如：王小明、場控A、計時組" maxlength="20" autocomplete="name">
      <div class="err" id="nameErr" hidden></div>

      </div>
      <p class="tiny">填好後右上角會顯示「我是 …」，點它隨時可以改。</p>
    </div></div>`);
  const input = ov.querySelector('#nameIn');

    if(/^(未署名|不知道|test|aaa|123)$/i.test(v)){ err.hidden = false; err.textContent = '請填真的認得出來的名字'; input.focus(); return; }
    const c = Store.cfg(); c.who = v; Store.saveCfg(c);
    ov.remove(); paintSync(); toast('已登記為 ' + v, 'good');
  };
  ov.querySelector('#nameOk').onclick = submit;

  };
  const cancel = ov.querySelector('#nameCancel');
  if(cancel) cancel.onclick = ()=> ov.remove();
  document.body.appendChild(ov);

}

/** 雲端那份是不是還沒被初始化過（空物件、缺欄位） */
function isBlank(o){
  return !o || typeof o !== 'object' || typeof o.rev !== 'number'
      || !Array.isArray(o.competitions) || !Array.isArray(o.teams);
}
async function pull(manual=true){
  try{
    S.lastErr='';
    const r = await Store.read(S.etag);
    if(r.notModified){ if(manual) toast('已是最新資料'); paintSync(); return; }
    if(isBlank(r.data)){
      // 保護：絕不讓空的雲端資料蓋掉你手上的內容
      if(manual && confirm('雲端還沒有資料。\n\n要把目前畫面上的內容上傳，建立第一個版本嗎？')) { S.baseRev = 0; return push(false, true); }
      if(manual) toast('雲端尚無資料，畫面顯示的仍是本機內容','bad');
      paintSync(); return;
    }
    const remote = normalize(r.data);
    S.etag = r.etag;
    if(S.dirty && remote.rev !== S.baseRev){ S.remote = remote; renderBanner(); paintSync(); return; }
    if(S.synced && !S.dirty && S.data && remote.rev === S.data.rev){ if(manual) toast('已是最新資料'); paintSync(); return; }
    applyRemote(remote);
    if(manual) toast('已載入最新資料', 'good');
  }catch(e){ S.lastErr = e.message; paintSync(); if(manual) toast(e.message,'bad'); }
}
function applyRemote(remote){
  const prev = localStorage.getItem(LS.cache);
  if(prev) localStorage.setItem(LS.prev, prev);   // 保留上一份，可在「連線與備份」還原
  S.data = remote; S.baseRev = remote.rev; S.dirty = false; S.remote = null; S.synced = true;
  localStorage.setItem(LS.cache, JSON.stringify(remote));
  renderBanner(); render(); paintSync();
}
async function push(silent=false, force=false){
  if(!Store.canWrite){ toast('目前為唯讀模式，請先在「設定」填入權杖','bad'); return; }
  if(nameNeeded()){ showNameGate(true); toast('請先登記你是誰，再保存','bad'); return; }
  if(S.saving) return;
  S.saving = true; paintSync();
  try{
    if(Store.mode==='gist' && !force){
      const r = await Store.read(null);
      if(r.data && r.data.rev !== S.baseRev && S.baseRev !== 0){
        S.remote = normalize(r.data); S.saving=false; renderBanner(); paintSync();
        toast('雲端已被其他人更新，請先處理下方提示','bad'); return;
      }
      if(r.data) S.etag = r.etag;
    }
    S.data.rev = (Number(S.data.rev)||0) + 1;
    S.data.updatedAt = new Date().toISOString();
    S.data.updatedBy = Store.cfg().who || '未署名';
    S.data.log = (S.data.log || []).concat([{ rev:S.data.rev, by:S.data.updatedBy, at:S.data.updatedAt }]).slice(-40);
    const w = await Store.write(S.data);
    if(w.etag) S.etag = w.etag;
    S.baseRev = S.data.rev; S.dirty = false; S.lastErr='';
    localStorage.setItem(LS.cache, JSON.stringify(S.data));
    if(!silent) toast('已保存到雲端','good');
    renderHeaderBits(); paintSync();
  }catch(e){ S.lastErr = e.message; toast(e.message,'bad'); }
  S.saving=false; paintSync();
}

function renderBanner(){
  const host = $('#bannerHost'); host.innerHTML='';
  if(!S.remote) return;

  b.innerHTML = `<div>

    </div><div class="acts"></div>`;
  const acts = b.querySelector('.acts');
  const load = document.createElement('button');
  load.className='btn primary'; load.textContent = S.dirty ? '放棄我的變更並載入' : '載入最新';
  load.onclick = ()=>{ if(S.dirty && !confirm('你未保存的變更會被覆蓋，確定嗎？')) return; applyRemote(S.remote); toast('已載入最新資料','good'); };
  acts.appendChild(load);

    acts.appendChild(keep);

  acts.appendChild(x);
  host.appendChild(b);
}
function startPolling(){
  clearInterval(S.polling);
  const c = Store.cfg();
  // 沒有權杖 = 未認證，上限只有每小時 60 次而且是「整個對外 IP 共用」，必須放慢
  const floor = c.token ? 5 : 120;
  const sec = Math.max(floor, Number(c.poll) || (c.token ? 10 : 120));
  S.polling = setInterval(async ()=>{
    if(document.hidden || S.saving) return;
    if(Date.now() < Rate.blockedUntil) return;   // 觸頂後暫停，等額度重置
    try{
      const r = await Store.read(S.etag);
      if(r.notModified || isBlank(r.data)) return;   // 空的雲端資料一律忽略
      const remote = normalize(r.data);
      S.etag = r.etag;
      if(S.synced && remote.rev === S.data?.rev && !S.dirty) return;
      if(remote.rev === S.baseRev) return;
      if(!S.dirty && Store.cfg().autoLoad){
        applyRemote(remote);                                  // 沒有未保存變更 → 直接自動更新
        toast('已自動更新：' + (remote.updatedBy||'') + ' v' + remote.rev, 'good');
      } else {
        S.remote = remote; renderBanner(); paintSync();       // 有變更或關閉自動載入 → 詢問使用者
      }
    }catch(e){ /* 靜默，避免現場干擾 */ }
  }, sec*1000);
}

/** 拖曳排序：抓住把手就能移動，滑鼠與觸控都可用。
 *  拖曳中直接搬動 DOM 節點做即時預覽，放開才寫回資料並重繪。 */
function makeSortable(container, apply, axis){
  let row = null, moved = false;
  const horiz = axis === 'x';
  const onMove = e=>{
    if(!row) return;
    e.preventDefault(); moved = true;
    const pos = horiz ? e.clientX : e.clientY;
    const others = [...container.children].filter(r => r !== row && r.dataset.sid);
    let placed = false;
    for(const r of others){
      const b = r.getBoundingClientRect();
      const mid = horiz ? b.left + b.width/2 : b.top + b.height/2;
      if(pos < mid){ container.insertBefore(row, r); placed = true; break; }
    }
    if(!placed) container.appendChild(row);
  };
  const onUp = ()=>{
    if(!row) return;
    row.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    const order = [...container.children].map(r => r.dataset.sid).filter(Boolean);
    row = null;
    if(moved) apply(order);
  };
  container.querySelectorAll('.dragh').forEach(h=>{
    h.onpointerdown = e=>{
      if(!Store.canWrite) return;
      e.preventDefault();
      row = h.closest('[data-sid]');
      if(!row) return;
      moved = false;
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove, { passive:false });
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    };
  });
}
/** 依拖曳後的 id 順序重排原陣列 */
function reorderBy(list, order, keyOf){
  const map = new Map(list.map(x => [keyOf(x), x]));
  const out = order.map(id => map.get(id)).filter(Boolean);
  list.forEach(x=>{ if(!out.includes(x)) out.push(x); });
  return out;
}

/** 下拉式分頁：label 是目前所在項目，點開才列出全部。
 *  分頁列本身會橫向捲動（overflow 會連帶裁掉垂直方向），
 *  所以選單掛在 body 上用 fixed 定位，才不會被裁掉。 */
function dropTab(label, active, items, alignRight){
  const wrap = document.createElement('div'); wrap.className='menu';
  const btn = document.createElement('button');
  btn.className='tab drop'; btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected', String(!!active));
  btn.setAttribute('aria-expanded','false');
  btn.innerHTML = `<span class="cur">${esc(label)}</span><span class="car">▼</span>`;

  const build = ()=>{
    const pop = document.createElement('div');
    pop.className = 'menu-pop';
    items.forEach(it=>{
      if(it.sec){ pop.appendChild(el(`<div class="sec">${esc(it.sec)}</div>`)); return; }
      const b = document.createElement('button');
      b.setAttribute('aria-current', String(S.tab === it.id));
      b.innerHTML = esc(it.label) + (it.sub?`<span class="sub">${esc(it.sub)}</span>`:'');
      b.onclick = ev=>{ ev.stopPropagation(); closeMenus(); goTab(it.id); };
      pop.appendChild(b);
    });
    pop.onclick = ev=> ev.stopPropagation();
    document.body.appendChild(pop);

    // 對齊按鈕，並確保不會超出畫面
    const r = btn.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 4) + 'px';
    const w = pop.offsetWidth || 240;
    let left = alignRight ? r.right - w : r.left;
    left = Math.min(Math.max(8, left), window.innerWidth - w - 8);
    pop.style.left = Math.round(left) + 'px';
    pop.dataset.owner = '1';
    return pop;
  };

  btn.onclick = e=>{
    e.stopPropagation();
    const wasOpen = btn.getAttribute('aria-expanded') === 'true';
    closeMenus();
    if(!wasOpen){
      const pop = build();
      btn.setAttribute('aria-expanded','true');
      pop._btn = btn;
    }
  };
  wrap.appendChild(btn);
  return wrap;
}
function closeMenus(){
  document.querySelectorAll('.menu-pop').forEach(p=>{
    if(p._btn) p._btn.setAttribute('aria-expanded','false');
    p.remove();
  });
  document.querySelectorAll('.tab.drop[aria-expanded="true"]').forEach(b=> b.setAttribute('aria-expanded','false'));
}

/** 手機版：把矩陣表改成由上到下的排行榜卡片，不用左右拖 */
function boardCards(c){
  const teams = rosterTeams(c);
  const place = compRanking(c);
  const n = compSize(c);
  const sorted = [...teams].sort((a,b)=>{
    const pa = compTotal(c,a.id)==null ? 999 : place[a.id];
    const pb = compTotal(c,b.id)==null ? 999 : place[b.id];
    return pa - pb;
  });
  const box = el(`<div class="rcards"></div>`);
  sorted.forEach(t=>{
    const tot = compTotal(c, t.id);
    const pl = place[t.id];
    const detail = c.events.map(ev=>{
      const rk = effRank(ev, t.id, n), sc = eventScore(ev, t.id, n);
      return `${esc(ev.name)} ${rk==null?'—':'第'+rk+'名'}${sc==null?'':'／'+sc+'分'}`;
    }).join('　');
    const cls = tot==null ? 'none' : (pl<=3 ? 'p'+pl : '');
    box.appendChild(el(`<div class="rcard ${cls}">
        <div class="pos">${tot==null?'<span class="n">—</span>':`<span class="em">${medal(pl)||'&nbsp;'}</span><span class="n">${pl}</span>`}</div>
        <div class="mid">
          <div class="nm">${esc(t.name)}</div>
          <div class="sub">${detail}</div>
        </div>
        <div class="tot">${tot==null?'—':tot}<small>總積分</small></div>
      </div>`));
  });
  return box;
}

    });

    S.data.teams.push(t);
    c.roster.push({ teamId:t.id, captain:'', contact:'', note:'' });
    markDirty(); render();
  };
  return p;
}
function eventCard(c, ev, n){
  const box = el(`<div class="panel"></div>`);
  const wLabel = c.mode==='sum' ? '直接累加' : `權重 ${ev.weight}%`;
  const hd = el(`<div class="panel-hd">
      <h2>${esc(ev.name)}</h2><span class="tagw">${esc(wLabel)}</span>
      <span class="why">積分表 ${ (ev.scores||[]).join(' / ') }${ev.tail?` · 其餘 ${ev.tail}`:''}</span>
      <div class="tools no-print">
        <button class="btn sm" data-a="renumber">重新編號</button>
        <button class="btn sm" data-a="clear">清空名次</button>
        <button class="btn sm danger" data-a="del">刪除項目</button>
      </div></div>`);
  hd.querySelector('[data-a=renumber]').onclick = ()=>{
    const rows = S.data.teams.map(t=>({t, r: ev.entries[t.id]?.rank}))
      .filter(x=>x.r!=null).sort((a,b)=>a.r-b.r);
    rows.forEach((x,i)=> entryOf(ev,x.t.id).rank = i+1);
    markDirty(); render();
  };
  hd.querySelector('[data-a=clear]').onclick = ()=>{
    if(!confirm(`清空「${ev.name}」所有名次？（隊長聯絡資訊會保留）`)) return;
    Object.values(ev.entries).forEach(e=>{ e.rank=null; e.dnf=false; });
    markDirty(); render(); toast('已清空「'+ev.name+'」的名次','good');
  };
  hd.querySelector('[data-a=del]').onclick = ()=>{
    if(!confirm(`刪除項目「${ev.name}」？`)) return;
    c.events = c.events.filter(x=>x.id!==ev.id); markDirty(); render();
  };
  box.appendChild(hd);

  // 快速登錄
  const q = el(`<div class="quick no-print"><div class="lbl">快速登錄名次 · 依抵達順序點選隊伍（再點一次取消）</div><div class="qchips"></div></div>`);
  const chips = q.querySelector('.qchips');
  const roster = rosterTeams(c);
  roster.forEach(t=>{
    const en = ev.entries[t.id] || {};
    const has = en.rank != null;
    const b = el(`<button class="qchip ${has?'done':''}"><span class="n ${has?'':'off'}">${has?en.rank:'–'}</span>${esc(t.name)}</button>`);
    b.onclick = ()=>{
      const e = entryOf(ev, t.id);
      if(e.rank != null){ e.rank = null; }
      else {
        const used = roster.map(x=>ev.entries[x.id]?.rank).filter(r=>r!=null);
        e.rank = used.length ? Math.max(...used)+1 : 1;
      }
      markDirty(); render();
    };
    chips.appendChild(b);
  });
  box.appendChild(q);

  // 名次登錄狀態列
  const au = rankAudit(ev, roster);
  const probs = [];
  au.dupes.forEach(d => probs.push(`第 ${d.rank} 名重複（${d.teams.map(t=>t.name).join('、')}）`));
  au.missing.forEach(m => probs.push(`缺少第 ${m} 名`));
  au.over.forEach(o => probs.push(`${o.team.name} 填第 ${o.rank} 名，超過參賽隊數 ${au.n}`));
  box.appendChild(el(`<div class="auditbar ${probs.length ? 'bad' : (au.ok ? 'good' : '')}">
      <span class="pg">登錄進度 ${au.filled + au.dnf} / ${au.n} 隊</span>
      ${ au.dnf ? `<span>中止 ${au.dnf} 隊</span>` : '' }
      ${ probs.length ? `<b>⚠ ${probs.map(esc).join('　｜　')}</b>`
         : (au.ok ? '<b>✓ 全部登錄完成，名次無重複、無跳號</b>'
                  : `<span>還有 ${au.blank.length} 隊未登錄：${au.blank.map(t=>esc(t.name)).join('、')}</span>`) }
    </div>`));

  // 歷年紀錄橫幅
  const rs = recordState(ev, c);
  if(rs.on){
    const unit = ev.record.unit || '秒';
    const recTxt = rs.rec==null || isNaN(rs.rec)
      ? '<span class="none">尚未填入歷年紀錄</span>'
      : `<span class="old">${esc(fmtPerf(rs.rec, ev))}</span>${ev.record.holder?`　保持人 ${esc(ev.record.holder)}`:''}${ev.record.year?`（${esc(ev.record.year)}）`:''}`;
    const bar = el(`<div class="recbar ${rs.broke.length?'broke':''}">
        <b>歷年紀錄</b>${recTxt}
        ${ rs.best!=null ? `　｜　<b>本次最佳</b> ${esc(fmtPerf(rs.best, ev))}　${rs.bestTeams.map(t=>esc(t.name)).join('、')}` : '　｜　<span class="none">本次尚未登錄成績</span>' }
        ${ rs.broke.length
            ? `<span class="tag">🏆 破紀錄</span><span style="font-weight:700">${rs.broke.map(t=>esc(t.name)).join('、')}　${rs.better==='max'?'超出':'快了'} ${rs.diff.toFixed(2)} ${esc(unit)}</span>`
            : (rs.rec!=null && !isNaN(rs.rec) && rs.best!=null ? '<span class="none">本次未破紀錄</span>' : '') }
      </div>`);
    box.appendChild(bar);
  }

  // 明細表
  const wrap = el(`<div class="scroller"><table class="grid">
    <thead><tr><th style="min-width:150px">組別</th><th style="width:170px">名次</th><th style="width:96px">積分</th>
      ${rs.on?'<th style="width:130px">本次成績</th>':''}
      <th style="min-width:110px">本項隊長</th><th style="min-width:140px">聯繫方式</th><th style="min-width:130px">備註</th></tr></thead>
    <tbody></tbody></table></div>`);
  const tb = wrap.querySelector('tbody');
  const dupes = {};
  roster.forEach(t=>{ const r = ev.entries[t.id]?.rank; if(r!=null) dupes[r]=(dupes[r]||0)+1; });

  roster.forEach(t=>{
    const en = entryOf(ev, t.id);
    const ri = rinfo(c, t.id);
    const tr = document.createElement('tr');
    if(en.dnf) tr.className='dnf';
    const sc = eventScore(ev, t.id, n);
    let opts = '<option value="">—</option>';
    for(let i=1;i<=Math.max(n, 12);i++)
      opts += `<option value="${i}" ${en.rank===i?'selected':''}>第 ${i} 名${i>n?'（超過隊數）':''}</option>`;
    tr.innerHTML = `
      <td class="tname" data-l="組別">${esc(t.name)}</td>
      <td data-l="名次"><div class="rankcell">
        ${rankMark(ev, t, au)}
        <select class="inp rank ${au.dupes.some(d=>d.rank===en.rank)?'err':(en.rank>au.n?'warn':'')}" data-f="rank" ${en.dnf?'disabled':''}>${opts}</select>
        <label class="chk"><input type="checkbox" data-f="dnf" ${en.dnf?'checked':''}> 中止</label>
      </div></td>
      <td data-l="積分"><span class="scorebox ${sc?'':'zero'}">${sc==null?'—':sc}</span></td>
      ${rs.on ? `<td data-l="本次成績"><input class="inp perf ${rs.best!=null && parsePerf(en.perf)===rs.best ? 'best':''} ${en.perf && isNaN(parsePerf(en.perf))?'bad':''}"
            data-f="perf" value="${esc(en.perf||'')}" placeholder="${ev.record.better==='max'?'例 128':"0'41\"79"}">
          ${ rs.broke.some(x=>x.id===t.id) ? '<span class="brk">🏆 破紀錄</span>' : '' }</td>` : ''}
      <td data-l="本項隊長"><input class="inp" data-f="captain" value="${esc(en.captain||'')}" placeholder="${esc(ri.captain||t.captain||'同本場隊長')}"></td>
      <td data-l="聯繫方式"><input class="inp" data-f="contact" value="${esc(en.contact||'')}" placeholder="${esc(ri.contact||t.contact||'分機 / 手機')}"></td>
      <td data-l="備註"><input class="inp" data-f="note" value="${esc(en.note||'')}" placeholder="成績、備註"></td>`;
    tr.querySelector('[data-f=rank]').onchange = e=>{ en.rank = e.target.value ? Number(e.target.value) : null; markDirty(); render(); };
    tr.querySelector('[data-f=dnf]').onchange = e=>{ en.dnf = e.target.checked; markDirty(); render(); };
    ['captain','contact','note'].forEach(f=>{
      tr.querySelector(`[data-f=${f}]`).oninput = e=>{ en[f] = e.target.value; markDirty(); };
    });
    const pf = tr.querySelector('[data-f=perf]');
    if(pf) pf.onchange = e=>{ en.perf = e.target.value.trim(); markDirty(); render(); };
    tb.appendChild(tr);
  });
  box.appendChild(wrap);
  box.appendChild(el(`<div class="rules">勾選「中止」代表該隊因故無法完賽，系統會以本項目最後一名（第 ${n} 名）的積分計點。</div>`));
  return box;
}

/* ============================================================
   頒獎典禮：依來源競賽／項目與名次，自動帶出得獎隊伍
   ============================================================ */
const PLACE_NAME = { 1:'冠軍', 2:'亞軍', 3:'季軍' };
const placeLabel = p => PLACE_NAME[p] || ('第 ' + p + ' 名');

/** 回傳 { teams:[...], tie:bool, ready:bool, why:'' } */
function awardResult(a){
  if(a.source === 'manual'){
    const t = teamById(a.teamId);
    return { teams: t ? [t] : [], tie:false, ready: !!t, why: t ? '' : '尚未指定隊伍' };
  }
  const c = S.data.competitions.find(x => x.id === a.compId);
  if(!c) return { teams:[], tie:false, ready:false, why:'來源競賽已被刪除' };

  if(a.source === 'event'){
    const ev = c.events.find(e => e.id === a.eventId);
    if(!ev) return { teams:[], tie:false, ready:false, why:'來源項目已被刪除' };
    const n = compSize(c);
    const hit = rosterTeams(c).filter(t => effRank(ev, t.id, n) === Number(a.place));
    return { teams:hit, tie:hit.length > 1, ready:hit.length > 0, why: hit.length ? '' : '這個項目還沒有這個名次' };
  }
  if(a.source === 'record'){
    const ev = c.events.find(e => e.id === a.eventId);
    if(!ev) return { teams:[], tie:false, ready:false, why:'來源項目已被刪除' };
    const st = recordState(ev, c);
    if(!st.on) return { teams:[], tie:false, ready:false, why:'這個項目沒有啟用紀錄比較' };
    if(!st.broke.length) return { teams:[], tie:false, ready:false, why:'本次無人破紀錄，本獎項從缺' };
    return { teams:st.broke, tie:st.broke.length > 1, ready:true, why:'' };
  }
  const place = compRanking(c);
  const scored = rosterTeams(c).filter(t => compTotal(c, t.id) != null);
  if(!scored.length) return { teams:[], tie:false, ready:false, why:'這場競賽還沒有任何成績' };
  const hit = scored.filter(t => place[t.id] === Number(a.place));
  return { teams:hit, tie:hit.length > 1, ready:hit.length > 0, why: hit.length ? '' : '尚未產生這個名次' };
}
/** 獎項對應的隊長與聯繫方式：項目層 → 該場名冊層 → 總名冊，取最貼近的一層 */
function awardContact(a, team){
  if(!team) return { captain:'', contact:'' };
  const c = S.data.competitions.find(x => x.id === a.compId);
  if(a.source !== 'manual' && c){
    const ev = a.source === 'event' ? c.events.find(e => e.id === a.eventId) : null;
    return { captain: contactChain(c, ev, team.id, 'captain'), contact: contactChain(c, ev, team.id, 'contact') };
  }
  return { captain: team.captain || '', contact: team.contact || '' };
}
/** 看起來像電話就做成可撥打連結 */
function telLink(v){
  const t = String(v||'').trim();
  if(!t) return '<span class="empty">未填</span>';
  const digits = t.replace(/[^\d+]/g, '');
  if(digits.length < 3) return esc(t);
  return `<a href="tel:${esc(digits)}" style="font-weight:700;white-space:nowrap">${esc(t)}</a>`;
}
function contactCell(a, teams){
  if(!teams.length) return '<span class="empty">—</span>';
  return teams.map(t=>{
    const k = awardContact(a, t);
    const who = k.captain ? esc(k.captain) : '<span class="empty">未填隊長</span>';
    return `<div style="line-height:1.5${teams.length>1?';padding:2px 0':''}">${teams.length>1?`<span style="font-size:11.5px;color:var(--ink-3)">${esc(t.name)}　</span>`:''}<b>${who}</b>　${telLink(k.contact)}</div>`;
  }).join('');
}

function awardSourceText(a){
  if(a.source === 'manual') return '手動指定';
  const c = S.data.competitions.find(x => x.id === a.compId);
  if(!c) return '（來源已刪除）';
  if(a.source === 'event' || a.source === 'record'){
    const ev = c.events.find(e => e.id === a.eventId);
    const nm = (c.short || c.name) + ' · ' + (ev ? ev.name : '（項目已刪除）');
    return a.source === 'record' ? nm + '　破紀錄' : nm;
  }
  return (c.short || c.name) + ' 總名次';
}

/** 獎次徽章：冠亞季軍用金銀銅，破紀錄用獎盃 */
function medalBadge(a, small){
  const sm = small ? ' sm' : '';
  if(a.source === 'record') return `<span class="mdl rec${sm}"><span class="em">🏆</span>破紀錄</span>`;
  if(a.source === 'manual') return `<span class="mdl none${sm}">特別獎</span>`;

  if(p === 1) return `<span class="mdl g${sm}"><span class="em">🥇</span>冠軍</span>`;
  if(p === 2) return `<span class="mdl s${sm}"><span class="em">🥈</span>亞軍</span>`;
  if(p === 3) return `<span class="mdl b${sm}"><span class="em">🥉</span>季軍</span>`;

}
function awardRowClass(a){
  if(a.source === 'record') return 'aw1';
  if(a.source === 'manual') return '';
  return ({1:'aw1',2:'aw2',3:'aw3'})[Number(a.place)] || '';
}

/* 頒獎檢視：比照典禮流程表，同一位頒獎長官的獎項合併 */
function awardsView(rows){
  const done = rows.filter(a => a.done).length;
  const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
  const nextId = (rows.find(a => !a.done) || {}).id;

  const p = el(`<div class="panel">
    <div class="awprog no-print">
      <span class="num">頒獎進度 ${done} / ${rows.length}</span>
      <span class="track"><span class="fill ${done===rows.length?'all':''}" style="width:${pct}%"></span></span>
      <span style="font-size:12.5px;color:var(--ink-3)">${done===rows.length ? '全部頒發完畢 🎉' : `下一項：${esc((rows.find(a=>!a.done)||{}).title || '')}`}</span>
      <button class="btn sm" id="awReset">全部重設為未頒發</button>
    </div>
    <div class="scroller"><table class="board">
    <thead><tr><th class="rowhd" style="min-width:230px">獎項別／梯次別</th>
      <th style="width:130px">獎次</th>
      <th style="min-width:170px">得獎隊伍</th><th style="min-width:200px">隊長／聯繫方式</th>
      <th style="min-width:130px">頒獎長官</th><th style="width:110px" class="no-print">頒獎狀態</th></tr></thead>
    <tbody></tbody></table></div></div>`);
  p.querySelector('#awReset').onclick = ()=>{
    if(!rows.some(a=>a.done)) { toast('目前沒有已頒發的獎項'); return; }
    if(!confirm('把所有獎項標記回「未頒發」？')) return;
    rows.forEach(a=> a.done = false); markDirty(); render();
  };
  const tb = p.querySelector('tbody');

  // 連續同一位長官的列合併
  const groups = [];
  rows.forEach(a=>{
    const key = (a.presenter||'').trim();
    const last = groups[groups.length-1];
    if(last && last.key === key) last.items.push(a);
    else groups.push({ key, items:[a] });
  });

  groups.forEach(g=>{
    g.items.forEach((a, i)=>{
      const r = awardResult(a);
      const tr = document.createElement('tr');
      tr.className = 'r-score ' + awardRowClass(a) + (a.done ? ' awdone' : (a.id === nextId ? ' awnext' : ''));
      const names = r.teams.map(t=>esc(t.name)).join('、');
      let cell;
      if(r.tie) cell = `<span style="color:#c92f18;font-weight:900">${names}</span><span class="w" style="color:#c92f18">${a.source==='record'?'多隊同時破紀錄，待決定':'同分並列，待決定'}</span>`;
      else if(!r.ready) cell = `<span class="empty">${esc(r.why || '尚未產生')}</span>`;
      else cell = `<span style="font-weight:900">${names}</span>`;
      tr.innerHTML = `
        <th class="rowhd" style="text-align:left">${a.id===nextId&&!a.done?'<span class="nextflag">下一項</span>':''}${esc(a.title)}
          <span class="w">${esc(awardSourceText(a))}${a.note?' · '+esc(a.note):''}</span></th>
        <td class="mcell">${medalBadge(a)}</td>
        <td style="text-align:left">${cell}</td>
        <td style="text-align:left;font-size:14px;font-weight:400">${contactCell(a, r.teams)}</td>
        ${ i===0 ? `<td rowspan="${g.items.length}" style="vertical-align:middle;font-weight:700">${esc(g.key||'—')}</td>` : '' }
        <td class="no-print"><button class="awdone-btn ${a.done?'on':''}">${a.done?'✓ 已頒發':'標記已頒'}</button></td>`;
      tr.querySelector('.awdone-btn').onclick = ()=>{ a.done = !a.done; markDirty(); render(); };
      if(r.tie && !a.done) tr.style.background = '#fff5f3';
      tb.appendChild(tr);
    });
  });
  return p;
}

/* 編輯模式 */
function awardsEdit(rows){
  const p = el(`<div class="panel"><div class="scroller"><table class="grid">
    <thead><tr><th style="width:86px">順序</th><th style="min-width:210px">獎項名稱</th>
      <th style="min-width:200px">來源</th><th style="width:110px">名次</th><th style="width:110px">獎次</th>
      <th style="min-width:150px">得獎隊伍</th><th style="min-width:190px">隊長／聯繫方式</th><th style="min-width:130px">頒獎長官</th>
      <th style="min-width:110px">備註</th><th style="width:60px"></th></tr></thead>
    <tbody></tbody></table></div></div>`);
  const tb = p.querySelector('tbody');

  rows.forEach((a, i)=>{
    const r = awardResult(a);
    const tr = document.createElement('tr');
    tr.className = awardRowClass(a);
    if(r.tie) tr.style.background = '#fff5f3';

    let srcOpts = '';
    S.data.competitions.forEach(c=>{
      srcOpts += `<option value="comp:${c.id}" ${a.source==='comp'&&a.compId===c.id?'selected':''}>${esc(c.short||c.name)}　總名次</option>`;
      c.events.forEach(ev=>{
        srcOpts += `<option value="event:${c.id}:${ev.id}" ${a.source==='event'&&a.eventId===ev.id?'selected':''}>${esc(c.short||c.name)} · ${esc(ev.name)}</option>`;
      });
    });
    S.data.competitions.forEach(c=> c.events.forEach(ev=>{
      if(ev.record && ev.record.on)
        srcOpts += `<option value="record:${c.id}:${ev.id}" ${a.source==='record'&&a.eventId===ev.id?'selected':''}>🏆 ${esc(c.short||c.name)} · ${esc(ev.name)}　破紀錄</option>`;
    }));
    srcOpts += `<option value="manual" ${a.source==='manual'?'selected':''}>手動指定隊伍</option>`;

    let plOpts = '';
    for(let k=1;k<=8;k++) plOpts += `<option value="${k}" ${Number(a.place)===k?'selected':''}>${placeLabel(k)}</option>`;

    let teamOpts = '<option value="">—</option>';
    S.data.teams.forEach(t=> teamOpts += `<option value="${t.id}" ${a.teamId===t.id?'selected':''}>${esc(t.name)}</option>`);

    const winner = a.source==='manual'
      ? `<select class="inp" data-f="teamId">${teamOpts}</select>`
      : (r.tie
          ? `<span style="color:#c92f18;font-weight:900">${r.teams.map(t=>esc(t.name)).join('、')}</span>
             <span style="display:block;font-size:11.5px;color:#c92f18;font-weight:700">${a.source==='record'?'多隊同時破紀錄，請先決定':'同分並列，請先決定'}</span>`
          : (r.ready ? `<b>${esc(r.teams[0].name)}</b>` : `<span style="color:var(--ink-3);font-size:12.5px">${esc(r.why)}</span>`));

    tr.dataset.sid = a.id;
    tr.innerHTML = `
      <td style="white-space:nowrap"><span class="dragh" title="按住拖曳排序">⠿</span><button class="btn icon sm" data-d="-1">▲</button><button class="btn icon sm" data-d="1">▼</button></td>
      <td data-l="獎項名稱"><input class="inp" data-f="title" value="${esc(a.title)}" placeholder="例：瑞昱趣味競賽_就是灌籃高手"></td>
      <td data-l="來源"><select class="inp" data-f="src">${srcOpts}</select></td>
      <td data-l="名次"><select class="inp" data-f="place" ${a.source==='manual'?'disabled':''}>${plOpts}</select></td>
      <td class="mcell" data-l="獎次">${medalBadge(a, true)}</td>
      <td data-l="得獎隊伍">${winner}</td>
      <td style="font-size:13px">${contactCell(a, a.source==='manual' ? (teamById(a.teamId)?[teamById(a.teamId)]:[]) : r.teams)}</td>
      <td data-l="頒獎長官"><input class="inp" data-f="presenter" value="${esc(a.presenter||'')}" placeholder="頒獎長官"></td>
      <td data-l="備註"><input class="inp" data-f="note" value="${esc(a.note||'')}" placeholder="例：(3)"></td>
      <td><button class="btn sm danger" data-x="1">刪除</button></td>`;

    tr.querySelectorAll('[data-d]').forEach(b=> b.onclick = ()=>{
      const j = i + Number(b.dataset.d);
      if(j<0 || j>=rows.length) return;
      [rows[i], rows[j]] = [rows[j], rows[i]];
      markDirty(); render();
    });
    tr.querySelector('[data-f=src]').onchange = e=>{
      const v = e.target.value;
      if(v === 'manual'){ a.source='manual'; }
      else if(v.startsWith('comp:')){ a.source='comp'; a.compId=v.slice(5); a.eventId=''; }
      else if(v.startsWith('record:')){ const [,cid,eid] = v.split(':'); a.source='record'; a.compId=cid; a.eventId=eid; }
      else { const [,cid,eid] = v.split(':'); a.source='event'; a.compId=cid; a.eventId=eid; }
      markDirty(); render();
    };
    if(a.source==='record'){ const ps = tr.querySelector('[data-f=place]'); if(ps) ps.disabled = true; }
    tr.querySelector('[data-f=place]').onchange = e=>{ a.place = Number(e.target.value); markDirty(); render(); };
    const ts = tr.querySelector('[data-f=teamId]');
    if(ts) ts.onchange = e=>{ a.teamId = e.target.value; markDirty(); render(); };
    ['title','presenter','note'].forEach(f=>{
      tr.querySelector(`[data-f=${f}]`).oninput = e=>{ a[f] = e.target.value; markDirty(); };
    });
    tr.querySelector('[data-x]').onclick = ()=>{
      if(!confirm(`刪除獎項「${a.title}」？`)) return;
      S.data.awards = rows.filter(x => x.id !== a.id); markDirty(); render();
    };
    tb.appendChild(tr);
  });

  makeSortable(tb, order=>{ S.data.awards = reorderBy(S.data.awards, order, x=>x.id); markDirty(); render(); });
  p.insertBefore(el(`<div class="sorthint">抓住左邊的 ⠿ 上下拖曳即可調整頒獎順序，也可以用 ▲▼ 微調。</div>`), p.firstChild);
  p.appendChild(el(`<div class="rules">「來源」可選整場競賽的總名次，也可指定單一項目的名次；破紀錄之類沒有固定來源的獎項選「手動指定隊伍」。
    名次一改，得獎隊伍立刻跟著換。同分並列的獎項會整列標紅，頒獎前務必先決定歸屬。
    聯繫方式取自該場競賽的隊長資料（項目層 → 本場名冊 → 總名冊），手機板上點一下號碼就能直接撥打。</div>`));
  return p;
}

/* ---------- 手寫板照片面板 ---------- */
function photoPanel(c, compact){
  const p = el(`<div class="panel"><div class="panel-hd">
      <h2>手寫板紀錄</h2>
      <span class="why">上傳現場紙本板子的照片，所有人立刻看得到</span>
      <div class="tools">
        <button class="btn sm no-lock" data-a="reload">重新整理</button>
        <button class="btn sm" data-a="pick">上傳照片</button>
      </div></div>
    <div class="pbar"><span class="sz" data-r="info">載入中…</span></div>
    <div class="photos" data-r="grid"><span style="color:var(--ink-3);font-size:13px">載入中…</span></div>
    <input type="file" accept="image/*" multiple hidden data-r="file"></div>`);

  const grid = p.querySelector('[data-r=grid]');
  const info = p.querySelector('[data-r=info]');
  const file = p.querySelector('[data-r=file]');

  const paint = (list, all)=>{
    grid.innerHTML = '';
    (list||[]).forEach(ph=>{
      const card = el(`<div class="pcard">
          <img src="${ph.data}" alt="${esc(ph.name||'')}" loading="lazy">
          <div class="meta"><b>${esc(ph.by||'')}</b><span>${fmt(ph.at)}</span>
            <button data-x="1">刪除</button></div>
        </div>`);
      card.querySelector('img').onclick = ()=> lightbox(ph.data, `${c.short||c.name} · ${ph.by||''} · ${fmt(ph.at)}`);
      card.querySelector('[data-x]').onclick = async ()=>{
        if(!confirm('刪除這張照片？')) return;
        all[c.id] = (all[c.id]||[]).filter(x=>x.id !== ph.id);
        try{ await Photos.save(all); toast('已刪除','good'); render(); }
        catch(e){ toast(e.message,'bad'); }
      };
      grid.appendChild(card);
    });
    if(Store.canWrite){
      const drop = el(`<button class="pdrop"><span class="big">＋</span><span>上傳照片</span>
        <span style="font-weight:400;font-size:11.5px">手機可直接拍照</span></button>`);
      drop.onclick = ()=> file.click();
      grid.appendChild(drop);
    } else if(!(list||[]).length){
      grid.innerHTML = '<span style="color:var(--ink-3);font-size:13px">目前還沒有上傳照片</span>';
    }
    const bytes = JSON.stringify(all||{}).length;
    info.textContent = `${(list||[]).length} 張照片 · 相簿目前約 ${(bytes/1048576).toFixed(2)} MB`
      + (S.data.photoGistId ? '' : ' · 第一次上傳時會自動建立相簿');
  };

  const refresh = async (force)=>{
    try{
      const all = await Photos.load(force);
      paint(all[c.id] || [], all);
    }catch(e){
      grid.innerHTML = '';
      info.textContent = e.message;
      if(Store.canWrite){
        const drop = el(`<button class="pdrop"><span class="big">＋</span><span>上傳照片</span></button>`);
        drop.onclick = ()=> file.click();
        grid.appendChild(drop);
      }
    }
  };

  const upload = async (files)=>{
    if(!files || !files.length) return;
    if(!Store.canWrite){ toast('唯讀模式無法上傳','bad'); return; }
    if(nameNeeded()){ showNameGate(true); return; }
    info.textContent = `處理中… 0/${files.length}`;
    try{
      const all = await Photos.load(true);
      all[c.id] ||= [];
      let i = 0;
      for(const f of files){
        i++;
        info.textContent = `壓縮中… ${i}/${files.length}`;
        const data = await Photos.compress(f);
        all[c.id].push({ id:uid('p'), name:f.name, at:new Date().toISOString(), by:Store.cfg().who||'', data });
      }
      info.textContent = '上傳中…';
      await Photos.save(all);
      toast(`已上傳 ${files.length} 張，其他裝置馬上看得到`,'good');
      paint(all[c.id], all);
    }catch(e){ toast(e.message,'bad'); info.textContent = e.message; }
  };

  p.querySelector('[data-a=pick]').onclick = ()=> file.click();
  p.querySelector('[data-a=reload]').onclick = ()=> refresh(true);
  file.onchange = e=>{ const fs = [...e.target.files]; e.target.value=''; upload(fs); };
  refresh(false);
  return p;
}

      <td data-l="聯繫方式"><input class="inp" data-f="contact" value="${esc(t.contact||'')}" placeholder="分機 / 手機 / Line"></td>
      <td data-l="備註"><input class="inp" data-f="note" value="${esc(t.note||'')}" placeholder="部門、人數…"></td>
      <td>${badges}</td>
      <td><button class="btn sm danger" data-x="1">刪除</button></td>`;
    tr.querySelectorAll('[data-d]').forEach(b=> b.onclick=()=>{

      const a=S.data.teams; [a[i],a[j]]=[a[j],a[i]]; markDirty(); render();
    });
    ['name','captain','contact','note'].forEach(f=>{
      tr.querySelector(`[data-f=${f}]`).oninput = e=>{ t[f]=e.target.value; markDirty(); if(f==='name') renderHeaderBits(); };
    });
    tr.querySelector('[data-x]').onclick = ()=>{
      if(!confirm(`從總名冊刪除「${t.name}」？\n該隊在所有競賽的名冊與成績都會一併移除。`)) return;
      S.data.teams = S.data.teams.filter(x=>x.id!==t.id);
      S.data.competitions.forEach(c=>removeFromRoster(c, t.id));
      markDirty(); render();
    };
    tb.appendChild(tr);
  });
  p.querySelector('#addT').onclick = ()=>{
    S.data.teams.push({ id:uid('t'), name:'新隊伍 '+(S.data.teams.length+1), captain:'', contact:'', note:'' });
    markDirty(); render();

  makeSortable(tb, order=>{ S.data.teams = reorderBy(S.data.teams, order, x=>x.id); markDirty(); render(); });

  frag.appendChild(p);
  return frag;
}

/* ---------- 賽事設定 ---------- */
function viewSetup(){

  </div></div>`);

  g.querySelector('#f_ov').onchange = e=>{ S.data.showOverall=e.target.checked; markDirty(); };
  frag.appendChild(g);

  S.data.competitions.forEach((c,ci)=>{
    const p = el(`<div class="panel"><div class="panel-hd"><h2>${esc(c.name)}</h2>
      <div class="tools">
        <button class="btn sm" data-a="up">▲</button><button class="btn sm" data-a="down">▼</button>
        <button class="btn sm danger" data-a="del">刪除競賽</button></div></div>
      <div class="panel-bd">
        <div class="cols">
          <div class="field"><label>競賽全名</label><input class="inp" data-f="name" value="${esc(c.name)}"></div>
          <div class="field"><label>分頁短名</label><input class="inp" data-f="short" value="${esc(c.short||'')}"></div>
          <div class="field"><label>計分方式</label>
            <select class="inp" data-f="mode">
              <option value="weighted" ${c.mode==='weighted'?'selected':''}>加權（各項權重 % 相加）</option>
              <option value="sum" ${c.mode==='sum'?'selected':''}>累加（各項積分直接相加）</option>
            </select></div>
          <div class="field"><label>綜合總表權重</label><input class="inp" type="number" step="0.1" data-f="weight" value="${c.weight}"></div>
          <div class="field"><label>同分時比較項目</label>
            <select class="inp" data-f="tie"><option value="">不設定（同分並列）</option>
            ${c.events.map(e=>`<option value="${e.id}" ${c.tieBreak===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>說明文字</label><input class="inp" data-f="note" value="${esc(c.note||'')}"></div>
        <div id="evs_${c.id}"></div>
        <button class="btn sm ghost" data-a="addev">＋ 新增項目</button>
      </div></div>`);
